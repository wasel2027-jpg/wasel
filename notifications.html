<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واصل — الإشعارات</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .notif-header{
    position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);padding:13px 16px;display:flex;align-items:center;gap:12px;
  }
  .back-btn{background:var(--bg);border:none;width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:background .15s,color .15s;}
  .back-btn:hover{background:var(--primary-tint);color:var(--primary-dark);}
  .notif-header-titles{flex:1;min-width:0;}
  .notif-header-titles h2{margin:0;font-size:17px;line-height:1.3;}
  .notif-header-sub{font-size:12px;color:var(--muted);margin-top:1px;font-weight:600;}
  .notif-header-sub b{color:var(--primary-dark);font-weight:800;}
  .mark-all-btn{
    width:40px;height:40px;border-radius:50%;border:none;background:var(--primary-tint);color:var(--primary-dark);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,transform .15s;
  }
  .mark-all-btn:hover{background:var(--primary);color:#fff;}
  .mark-all-btn:active{transform:scale(.92);}
  .mark-all-btn:disabled{background:var(--bg);color:var(--muted);cursor:default;}
  .mark-all-btn:disabled:hover{background:var(--bg);color:var(--muted);}

  .notif-item{
    display:flex;align-items:flex-start;gap:12px;padding:13px;margin-bottom:8px;position:relative;
  }
  .notif-icon{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    position:absolute;bottom:-2px;left:-2px;border:2px solid #fff;background:var(--primary);color:#fff;
  }
  .notif-icon.like{background:var(--accent);}
  .notif-icon.follow{background:var(--primary);}
  .notif-icon.friend_request{background:var(--gold);}
  .notif-icon.friend_accept{background:var(--success);}
  .notif-avatar-wrap{position:relative;flex:0 0 auto;}
  .notif-info{flex:1;min-width:0;}
  .notif-text{font-size:14px;line-height:1.5;color:var(--ink);}
  .notif-text b{font-weight:800;}
  .notif-time{font-size:12px;color:var(--muted);margin-top:3px;}
  .notif-item.unread{background:var(--primary-tint);border-radius:var(--radius-md);}
  .notif-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:0 0 auto;margin-top:6px;}
  .empty-notif{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-notif svg{margin-bottom:14px;opacity:.5;}
</style>
</head>
<body class="auth-pending">
<div class="auth-gate"><div class="spinner dark"></div></div>

<div class="notif-header">
  <a href="home.html" class="back-btn">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="notif-header-titles">
    <h2>الإشعارات</h2>
    <div class="notif-header-sub" id="notifHeaderSub">كله مقروء</div>
  </div>
  <button class="mark-all-btn" id="markAllReadBtn" title="تحديد الكل كمقروء" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12.5l4.5 4.5L15 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 13l3 3L22 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<main class="page-container" style="padding-top:14px;">
  <div id="notifList">
    <div class="skeleton" style="height:66px;margin-bottom:8px;border-radius:12px;"></div>
    <div class="skeleton" style="height:66px;margin-bottom:8px;border-radius:12px;"></div>
    <div class="skeleton" style="height:66px;margin-bottom:8px;border-radius:12px;"></div>
  </div>
  <div class="empty-notif" id="emptyNotif" style="display:none;">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5v3.2c0 .5-.2 1-.5 1.4L5 15h14l-1.5-2.4a2 2 0 0 1-.5-1.4V8a5 5 0 0 0-5-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <p>لسه مفيش إشعارات</p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/common.js"></script>
<script src="js/social.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
