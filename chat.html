<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واصل — محادثة</title>
<style>
/* =========================================================
   واصل (Wasel) — نظام التصميم المشترك
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap');

:root{
  /* الألوان */
  --bg: #F5F4FB;
  --surface: #FFFFFF;
  --surface-2: #FBFAFF;
  --ink: #1A1B3A;
  --ink-soft: #4A4B6A;
  --muted: #83839E;
  --border: #E6E4F4;
  --border-soft: #EFEEF8;

  --primary: #5B4FE8;
  --primary-dark: #453BC4;
  --primary-tint: #EEECFD;

  --accent: #FF6B5B;      /* لايك / تنبيهات */
  --accent-tint: #FFE9E5;

  --success: #22B27D;     /* حفظ / تأكيد */
  --success-tint: #E1F7EE;

  --gold: #E8A33D;        /* شارات ثانوية */

  --shadow-sm: 0 1px 2px rgba(26,27,58,.06);
  --shadow-md: 0 8px 24px rgba(26,27,58,.10);
  --shadow-lg: 0 20px 48px rgba(26,27,58,.16);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  direction:rtl;
  font-family:'Tajawal', sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.brand{font-family:'Almarai', sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
input,textarea,select{font-family:inherit;}

::selection{background:var(--primary-tint);color:var(--primary-dark);}

/* ============ شعار العلامة (الإشارة البصرية المميزة) ============ */
.brand-mark{
  width:38px;height:38px;flex:0 0 auto;position:relative;
}
.brand-mark svg{width:100%;height:100%;display:block;}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:22px;color:var(--primary-dark);
  letter-spacing:-.3px;
}

/* ============ أزرار ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:var(--radius-pill);border:none;
  font-weight:700;font-size:15px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(91,79,232,.30);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#C9C6EE;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--primary-tint);border-color:var(--primary-tint);}
.btn-block{width:100%;}
.btn-text{background:none;border:none;color:var(--primary);font-weight:700;padding:6px 4px;}

/* ============ حقول الإدخال ============ */
.field{margin-bottom:18px;text-align:right;}
.field label{
  display:block;font-size:13px;font-weight:700;color:var(--ink-soft);
  margin-bottom:7px;
}
.field .req{color:var(--accent);}
.field-input{
  width:100%;padding:14px 16px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--surface-2);
  font-size:15px;color:var(--ink);transition:border-color .15s, background .15s;
}
.field-input:focus{outline:none;border-color:var(--primary);background:#fff;}
.field-hint{font-size:12px;color:var(--muted);margin-top:6px;}
.field-error{font-size:12px;color:var(--accent);margin-top:6px;display:none;font-weight:700;}
.field.has-error .field-input{border-color:var(--accent);background:var(--accent-tint);}
.field.has-error .field-error{display:block;}

.select-group{display:flex;gap:10px;}
.select-chip{
  flex:1;padding:14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface-2);text-align:center;font-weight:700;color:var(--ink-soft);
  transition:all .15s;
}
.select-chip.active{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-dark);}

/* ============ بطاقات ============ */
.card{
  background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);
}

/* ============ تنبيه توست ============ */
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--radius-pill);
  font-size:14px;font-weight:700;box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease;
}
.toast.success{background:var(--success);}
.toast.error{background:var(--accent);}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* ============ سكيلتون تحميل ============ */
.skeleton{background:linear-gradient(90deg,#EEEDF8 25%,#F6F5FC 37%,#EEEDF8 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============ هيدر عام (داخلي/فوتر تنقل) ============ */
.app-header{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.app-header-inner{
  max-width:1100px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.header-search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-pill);
  padding:10px 16px;color:var(--muted);transition:border-color .15s;
}
.header-search:hover,.header-search:focus-within{border-color:var(--border);}
.header-search input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);
  display:flex;align-items:center;justify-content:center;position:relative;
  color:var(--ink-soft);transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--primary-tint);color:var(--primary-dark);}
.icon-btn .badge{
  position:absolute;top:-2px;left:-2px;background:var(--accent);color:#fff;
  font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;
}
.avatar{
  border-radius:50%;object-fit:cover;background:var(--primary-tint);
  display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-weight:800;
  overflow:hidden;flex:0 0 auto;
}
.avatar-sm{width:38px;height:38px;font-size:15px;}
.avatar-md{width:48px;height:48px;font-size:18px;}
.avatar-lg{width:96px;height:96px;font-size:32px;border:4px solid #fff;box-shadow:var(--shadow-md);}
.avatar-xl{width:128px;height:128px;font-size:40px;border:5px solid #fff;box-shadow:var(--shadow-md);}

/* ============ حاوية الصفحة ============ */
.page-container{max-width:640px;margin:0 auto;padding:20px 14px 90px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

/* ============ مؤشر تحميل ============ */
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
.spinner.dark{border:2.5px solid var(--border);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* ============ بوابة التحقق من تسجيل الدخول ============
   بتمنع ظهور أي محتوى في الصفحة قبل ما نتأكد إن فيه جلسة
   صحيحة ومش محظورة، عشان محدش يشوف الصفحة الرئيسية أو أي
   صفحة محمية غير وهو داخل بحساب فعلاً.                     */
body.auth-pending > *:not(.auth-gate){
  display:none !important;
}
.auth-gate{
  position:fixed;inset:0;z-index:99999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}

@media (max-width:480px){
  .header-search{display:none;}
}

/* ============ شارة التوثيق (الحساب الموثّق) ============ */
.verified-badge{vertical-align:-2.5px;margin-inline-start:4px;flex:0 0 auto;}
.name-with-badge{display:inline-flex;align-items:center;}

/* ============ أزرار العلاقة في البروفايل (متابعة/صداقة/رسالة) ============ */
.profile-actions{display:flex;gap:10px;margin:14px 0 18px;}
.profile-actions .btn{padding:11px 18px;font-size:13.5px;flex:1;}
.btn-icon-circle{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto !important;padding:0 !important;
  display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink-soft);border:none;
}
.btn-icon-circle:hover{background:var(--primary-tint);color:var(--primary-dark);}
.btn-friend-pending{background:var(--surface-2);color:var(--ink-soft);border:1.5px solid var(--border);}
.btn-friend-accept{background:var(--success);color:#fff;}
.profile-counts{display:flex;gap:18px;margin:2px 0 10px;font-size:13px;color:var(--ink-soft);}
.profile-counts b{color:var(--ink);font-weight:800;}

/* ============ اقتراح متابعة الحساب الرسمي ============ */
.official-suggest{
  display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px;
}
.official-suggest .avatar{background:var(--primary);color:#fff;}
.official-suggest-text{flex:1;}
.official-suggest-title{font-weight:800;font-size:14px;display:flex;align-items:center;}
.official-suggest-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ============ قائمة المحادثات ============ */
.chat-item{
  display:flex;align-items:center;gap:13px;padding:13px 8px;border-radius:12px;position:relative;
}
.chat-item:hover{background:var(--surface-2);}
.chat-item-info{flex:1;min-width:0;}
.chat-item-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;}
.chat-item-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chat-item-preview.unread{color:var(--ink);font-weight:700;}
.chat-item-time{font-size:11px;color:var(--muted);flex:0 0 auto;align-self:flex-start;margin-top:2px;}
.chat-unread-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:0 0 auto;}
.empty-chats{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-chats svg{margin-bottom:14px;opacity:.5;}

/* ============ صفحة محادثة فردية (بأسلوب ماسنجر) ============ */
.chat-topbar{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:10px 14px;display:flex;align-items:center;gap:12px;
  transition:box-shadow .2s;
}
.chat-topbar.is-scrolled{box-shadow:var(--shadow-sm);}
.chat-topbar-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;}
.chat-topbar-status{font-size:11.5px;color:var(--muted);margin-top:1px;}
.chat-topbar-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}

.chat-messages{
  max-width:640px;margin:0 auto;padding:18px 14px 14px;min-height:60vh;
  display:flex;flex-direction:column;
}

/* فاصل التاريخ (اليوم / أمس / تاريخ) */
.chat-date-divider{
  display:flex;align-items:center;justify-content:center;margin:18px 0 14px;
  font-size:11.5px;font-weight:800;color:var(--muted);
}
.chat-date-divider span{
  background:var(--surface-2);padding:5px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--border-soft);
}

/* مجموعة رسائل متتالية من نفس الشخص */
.msg-group{display:flex;gap:8px;margin-bottom:14px;align-items:flex-end;}
.msg-group.mine{justify-content:flex-start;}
.msg-group.theirs{justify-content:flex-end;}
.msg-group-avatar{width:26px;height:26px;flex:0 0 auto;visibility:hidden;}
.msg-group-avatar.show{visibility:visible;}
.msg-stack{display:flex;flex-direction:column;max-width:72%;}
.msg-group.mine .msg-stack{align-items:flex-start;}
.msg-group.theirs .msg-stack{align-items:flex-end;}

.msg-row{display:flex;margin-top:2px;}
.msg-row:first-child{margin-top:0;}
.msg-bubble{
  padding:10px 15px;border-radius:18px;font-size:14.5px;line-height:1.55;
  word-break:break-word;white-space:pre-wrap;position:relative;
  animation:bubbleIn .18s ease;
}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg-group.mine .msg-bubble{background:var(--primary);color:#fff;}
.msg-group.theirs .msg-bubble{background:var(--surface-2);border:1px solid var(--border-soft);color:var(--ink);}

/* شكل الذيل: نضيّق الزاوية بس في آخر رسالة بالمجموعة */
.msg-group.mine .msg-row.is-last .msg-bubble{border-bottom-left-radius:5px;}
.msg-group.theirs .msg-row.is-last .msg-bubble{border-bottom-right-radius:5px;}
.msg-group.mine .msg-row:not(:first-child):not(.is-last) .msg-bubble,
.msg-group.mine .msg-row.is-last:not(:first-child) .msg-bubble{border-top-left-radius:6px;}
.msg-group.theirs .msg-row:not(:first-child):not(.is-last) .msg-bubble,
.msg-group.theirs .msg-row.is-last:not(:first-child) .msg-bubble{border-top-right-radius:6px;}

.msg-bubble.is-sending{opacity:.65;}
.msg-bubble.is-failed{background:var(--accent-tint);color:var(--ink);border:1px solid var(--accent);}

/* حاوية الفقاعة + الوقت/حالة القراءة — بتتقلّص على حجم الفقاعة نفسها
   عشان الوقت وعلامة القراءة تفضل ملزّقة بآخر الرسالة على جانب الشاشة،
   مش عنصر عريض يظهر في نص الصفحة */
.msg-body{width:fit-content;max-width:100%;}
.msg-group.mine .msg-body{margin-inline-start:auto;}
.msg-group.theirs .msg-body{margin-inline-end:auto;}
.msg-meta{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10.5px;color:var(--muted);width:fit-content;}
.msg-group.mine .msg-meta{flex-direction:row-reverse;margin-inline-start:auto;}
.msg-group.theirs .msg-meta{margin-inline-end:auto;}
.msg-status-icon{display:inline-flex;align-items:center;width:14px;height:14px;flex:0 0 auto;transition:color .15s ease;}
.msg-status-icon svg{width:100%;height:100%;}
.msg-status-icon.sending{color:var(--muted);animation:msgPulse 1s ease infinite;}
@keyframes msgPulse{0%,100%{opacity:.35;}50%{opacity:.9;}}
.msg-status-icon.sent{color:var(--muted);}
/* الرسالة اتقرأت (شوهدت) — علامة صح مزدوجة بلون مميز */
.msg-status-icon.read{color:#34B7F1;}
.msg-retry-btn{
  font-size:11px;font-weight:800;color:var(--accent);background:none;border:none;padding:0;
  cursor:pointer;text-decoration:underline;
}

.chat-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);padding:50px 24px;gap:10px;min-height:50vh;
}
.chat-empty-icon{
  width:64px;height:64px;border-radius:50%;background:var(--primary-tint);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
}
.chat-empty-title{font-weight:800;font-size:15px;color:var(--ink);}
.chat-empty-sub{font-size:13px;max-width:240px;}

/* زرار النزول لآخر المحادثة */
.scroll-bottom-btn{
  position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(12px);
  width:38px;height:38px;border-radius:50%;background:#fff;color:var(--primary);border:1px solid var(--border-soft);
  box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;
}
.scroll-bottom-btn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.scroll-bottom-btn .badge{
  position:absolute;top:-4px;left:-4px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;
  min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  padding:0 3px;border:2px solid #fff;
}

.chat-input-bar{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border-soft);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;
}
.chat-input-bar-inner{max-width:640px;margin:0 auto;display:flex;gap:9px;width:100%;align-items:flex-end;}
.chat-input-wrap{
  flex:1;display:flex;align-items:flex-end;border:1.5px solid var(--border);background:var(--surface-2);
  border-radius:22px;padding:5px 6px 5px 16px;transition:border-color .15s,background .15s;
}
.chat-input-wrap:focus-within{border-color:var(--primary);background:#fff;}
.chat-input-bar textarea{
  flex:1;border:none;background:none;outline:none;resize:none;font-family:inherit;
  font-size:14.5px;line-height:1.5;padding:7px 0;max-height:110px;color:var(--ink);
}
.chat-input-bar textarea::placeholder{color:var(--muted);}
.chat-send-btn{
  width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:background .15s,transform .12s;
}
.chat-send-btn:hover:not(:disabled){background:var(--primary-dark);}
.chat-send-btn:active:not(:disabled){transform:scale(.92);}
.chat-send-btn:disabled{background:#DAD8F5;color:#fff;cursor:not-allowed;}
.chat-send-btn svg{margin-inline-start:-1px;}

/* ============ طلبات الصداقة ============ */
.freq-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border-soft);}
.freq-item{display:flex;align-items:center;gap:13px;padding:13px;margin-bottom:10px;}
.freq-item-info{flex:1;min-width:0;}
.freq-item-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;}
.freq-item-time{font-size:12px;color:var(--muted);margin-top:2px;}
.freq-actions{display:flex;gap:8px;flex:0 0 auto;}
.freq-actions .btn{padding:9px 14px;font-size:12.5px;}
.btn-decline{background:var(--bg);color:var(--ink-soft);}
.empty-freq{text-align:center;padding:50px 20px;color:var(--muted);}

</style>
</head>
<body class="auth-pending">
<div class="auth-gate"><div class="spinner dark"></div></div>

<div class="chat-topbar" id="chatTopbar">
  <a href="messages.html" class="back-btn" style="background:var(--bg);border:none;width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-6 7 6 7"/></g></svg>
  </a>
  <a href="#" id="chatOtherProfileLink" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
    <div class="avatar avatar-sm" id="chatOtherAvatar"></div>
    <div class="chat-topbar-info">
      <div class="chat-topbar-name" id="chatOtherName">...</div>
      <div class="chat-topbar-status">اضغط لعرض الملف الشخصي</div>
    </div>
  </a>
</div>

<main class="chat-messages" id="chatMessages">
  <div class="skeleton" style="height:40px;width:60%;margin-bottom:10px;border-radius:16px;"></div>
  <div class="skeleton" style="height:40px;width:50%;margin-right:auto;margin-bottom:10px;border-radius:16px;"></div>
</main>

<button class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="النزول لآخر رسالة">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></g></svg>
  <span class="badge" id="scrollBottomBadge" style="display:none;"></span>
</button>

<div class="chat-input-bar">
  <div class="chat-input-bar-inner">
    <div class="chat-input-wrap">
      <textarea id="chatInput" rows="1" placeholder="اكتب رسالة..." maxlength="2000"></textarea>
    </div>

// =========================================================

// Firebase عادةً بيخلي المستخدم فاضل داخل حتى بعد ما يقفل المتصفح

<script>
// =========================================================
// ملف الربط المركزي بين كل الصفحات — واصل (Wasel)
// كل صفحة بتقرأ بيانات المستخدم اللي داخل بيها من هنا بدل ما
// كل صفحة تعمل استعلام لوحدها لقاعدة البيانات من الأول.
// =========================================================
const WaselSession = (function(){
  let cachedUser = null;
  let cachedData = null;
  let initialized = false;
  let readyQueue = [];

  const STORAGE_KEY = 'wasel_session_cache';

  function saveToTabCache(uid, data){
    try{
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ uid, data, savedAt: Date.now() }));
    }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  function readFromTabCache(uid){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(parsed.uid === uid) return parsed.data;
    }catch(e){}
    return null;
  }

  function clearTabCache(){
    try{ sessionStorage.removeItem(STORAGE_KEY); }catch(e){}
  }

  function resolveReady(user, data){
    initialized = true;
    cachedUser = user;
    cachedData = data;
    readyQueue.forEach(cb => cb(user, data));
    readyQueue = [];
  }

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      clearTabCache();
      resolveReady(null, null);
      return;
    }

    const fromCache = readFromTabCache(user.uid);
    if(fromCache){
      resolveReady(user, fromCache);
      return;
    }

    try{
      const snap = await db.ref('users/' + user.uid).get();
      let data = snap.exists() ? snap.val() : null;

      // شبكة أمان: مستخدم عنده حساب دخول (Auth) بس بياناته مش موجودة في قاعدة
      // البيانات (غالبًا بسبب مشكلة قديمة وقت التسجيل) — نعمّر له سجل أساسي
      // بدل ما يفضل يشوف "المستخدم غير موجود" في كل الصفحات
      if(!data){
        const fallback = {
          firstName: (user.displayName || 'مستخدم واصل').split(' ')[0],
          lastName: null,
          email: user.email && !user.email.endsWith('@wasel.app') ? user.email : null,
          phone: user.email && user.email.endsWith('@wasel.app') ? user.email.split('@')[0] : null,
          gender: 'male',
          birthDate: null,
          photoBase64: null,
          blocked: false,
          createdAt: Date.now(),
          lastLogin: Date.now()
        };
        try{
          await db.ref('users/' + user.uid).set(fallback);
          data = fallback;
        }catch(e){
          console.error('تعذر إنشاء بيانات المستخدم المفقودة تلقائيًا:', e);
        }
      }

      saveToTabCache(user.uid, data);
      resolveReady(user, data);
    }catch(err){
      console.error(err);
      resolveReady(user, null);
    }
  });

  return {
    /* بيتنفذ فورًا لو البيانات جاهزة، أو بيستنى لحد ما تجهز */
    onReady(callback){
      if(initialized) callback(cachedUser, cachedData);
      else readyQueue.push(callback);
    },

    getUser(){ return cachedUser; },
    getUserData(){ return cachedData; },

    /* لو صفحة عدّلت بيانات المستخدم (زي تغيير صورة البروفايل)
       تنادي الدالة دي عشان باقي الصفحات تاخد النسخة الجديدة   */
    updateCachedData(patch){
      if(!cachedUser) return;
      cachedData = { ...(cachedData || {}), ...patch };
      saveToTabCache(cachedUser.uid, cachedData);
    },

    refreshFromServer(){
      if(!cachedUser) return Promise.resolve(null);
      return db.ref('users/' + cachedUser.uid).get().then(snap => {
        const data = snap.exists() ? snap.val() : null;
        saveToTabCache(cachedUser.uid, data);
        cachedData = data;
        return data;
      });
    },

    /* ---------- تذكرني: حفظ البريد/الهاتف اللي دخل بيه بس (مش كلمة السر) ---------- */
    setRememberedIdentifier(identifier){
      try{ localStorage.setItem('wasel_remembered_identifier', identifier); }catch(e){}
    },
    clearRememberedIdentifier(){
      try{ localStorage.removeItem('wasel_remembered_identifier'); }catch(e){}
    },
    getRememberedIdentifier(){
      try{ return localStorage.getItem('wasel_remembered_identifier') || ''; }catch(e){ return ''; }
    }
  };
})();

</script>
<script>
// =========================================================
// أدوات مشتركة — واصل (Wasel)
// =========================================================

/* ---------- توست ---------- */
function ensureToastWrap(){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  return wrap;
}
function showToast(message, type=''){
  const wrap = ensureToastWrap();
  const el = document.createElement('div');
  el.className = `toast ${type}`.trim();
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

/* ---------- الأحرف الأولى كافاتار افتراضي ---------- */
function initialsOf(name){
  if(!name) return '؟';
  const parts = name.trim().split(' ');
  return parts[0] ? parts[0][0] : '؟';
}

/* ---------- حساب السن للتأكد من 18+ ---------- */
function calcAge(birthDateStr){
  const today = new Date();
  const birth = new Date(birthDateStr);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}

/* ---------- وقت نسبي ---------- */
function timeAgo(timestamp){
  const diff = Math.floor((Date.now() - timestamp) / 1000);
  if(diff < 60) return 'الآن';
  if(diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  if(diff < 86400) return `منذ ${Math.floor(diff/3600)} س`;
  if(diff < 2592000) return `منذ ${Math.floor(diff/86400)} يوم`;
  return new Date(timestamp).toLocaleDateString('ar-EG');
}

/* ---------- ضغط الصور قبل رفعها لقاعدة البيانات ----------
   قاعدة البيانات لسة ضعيفة، فبنضغط أي صورة (بروفايل أو منشور)
   وبنحولها base64 بحجم محدود بدل ما نستخدم Storage خارجي.        */
function compressImage(file, maxWidth = 800, quality = 0.7){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')){
      reject(new Error('الملف مش صورة'));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxWidth){
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve(base64);
      };
      img.onerror = () => reject(new Error('تعذر تحميل الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('تعذر قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

// أقصى حجم مسموح به لصورة المنشور بعد الضغط (تقريبًا)
const MAX_POST_IMAGE_BYTES = 350 * 1024; // ~350KB
function base64SizeBytes(base64){
  const clean = base64.split(',')[1] || base64;
  return Math.ceil((clean.length * 3) / 4);
}

/* ---------- حماية الصفحات: لازم يكون المستخدم مسجل دخول ----------
   البيانات بتتقرأ من WaselSession (js/session.js) اللي بيقرأها
   مرة واحدة بس ويشاركها بين كل الصفحات بدل ما كل صفحة تستعلم لوحدها.
   الصفحة بتفضل مخفية تمامًا (body.auth-pending) لحد ما نتأكد
   إن فيه جلسة صحيحة، عشان محدش يشوف حتى ومضة من المحتوى قبل التحقق. */
function requireAuth(onReady){
  WaselSession.onReady(async (user, data) => {
    if(!user){
      window.location.href = 'login.html';
      return;
    }
    if(data && data.blocked){
      await auth.signOut();
      showToast('تم إيقاف هذا الحساب', 'error');
      setTimeout(()=> window.location.href = 'login.html', 1200);
      return;
    }
    revealProtectedPage();
    onReady(user, data);
  });
}

function revealProtectedPage(){
  document.body.classList.remove('auth-pending');
  const gate = document.querySelector('.auth-gate');
  if(gate) gate.remove();
}

/* ---------- تسجيل الخروج ---------- */
function logout(){
  auth.signOut().then(() => window.location.href = 'login.html');
}

/* ---------- شارة التوثيق (تظهر جنب اسم أي حساب موثّق زي حساب واصل الرسمي) ---------- */
function verifiedBadgeHTML(){
  return `<svg class="verified-badge" width="15" height="15" viewBox="0 0 24 24" fill="none" title="حساب موثّق"><path d="M12 2.2l2.1 1.4 2.5-.6 1.3 2.2 2.3 1.1-.3 2.5 1.6 2-1.6 2 .3 2.5-2.3 1.1-1.3 2.2-2.5-.6L12 21.8l-2.1-1.4-2.5.6-1.3-2.2-2.3-1.1.3-2.5-1.6-2 1.6-2-.3-2.5 2.3-1.1 1.3-2.2 2.5.6Z" fill="#5B4FE8" stroke="none"/><path d="M8.3 12.2l2.4 2.4 5-5.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
}
function nameWithBadge(name, isVerified){
  return `<span class="name-with-badge">${escapeHTML(name || '')}${isVerified ? verifiedBadgeHTML() : ''}</span>`;
}

/* ---------- تهريب النصوص من HTML (مشتركة لكل الصفحات) ---------- */
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

<script>
// =========================================================
// منطق العلاقات المشترك — واصل (Wasel)
// المتابعة، طلبات الصداقة، والمحادثات — تستخدمه أي صفحة
// تحتاج تتعامل مع علاقات المستخدمين مع بعض.
// =========================================================
const WaselSocial = (function(){

  function fullNameOf(data){
    return [data && data.firstName, data && data.lastName].filter(Boolean).join(' ');
  }

  function chatIdFor(a, b){
    return [a, b].sort().join('_');
  }

  /* ---------------- المتابعة ---------------- */
  async function toggleFollow(me, meData, otherUid){
    const ref = db.ref(`follows/${me.uid}/following/${otherUid}`);
    const snap = await ref.get();
    if(snap.exists()){
      await Promise.all([
        ref.remove(),
        db.ref(`follows/${otherUid}/followers/${me.uid}`).remove()
      ]);
      return false;
    }
    await Promise.all([
      ref.set(true),
      db.ref(`follows/${otherUid}/followers/${me.uid}`).set(true)
    ]);
    if(otherUid !== me.uid){
      db.ref(`notifications/${otherUid}`).push({
        type: 'follow', fromUid: me.uid, fromName: fullNameOf(meData),
        read: false, createdAt: Date.now()
      });
    }
    return true;
  }

  /* ---------------- طلبات الصداقة ---------------- */
  async function sendFriendRequest(me, meData, otherUid){
    await Promise.all([
      db.ref(`friendRequests/${otherUid}/${me.uid}`).set({
        fromName: fullNameOf(meData), fromPhoto: meData.photoBase64 || null, createdAt: Date.now()
      }),
      db.ref(`sentFriendRequests/${me.uid}/${otherUid}`).set(true)
    ]);
    db.ref(`notifications/${otherUid}`).push({
      type: 'friend_request', fromUid: me.uid, fromName: fullNameOf(meData),
      read: false, createdAt: Date.now()
    });
  }

  async function cancelFriendRequest(me, otherUid){
    await Promise.all([
      db.ref(`friendRequests/${otherUid}/${me.uid}`).remove(),
      db.ref(`sentFriendRequests/${me.uid}/${otherUid}`).remove()
    ]);
  }

  async function declineFriendRequest(me, otherUid){
    await Promise.all([
      db.ref(`friendRequests/${me.uid}/${otherUid}`).remove(),
      db.ref(`sentFriendRequests/${otherUid}/${me.uid}`).remove()
    ]);
  }

  async function acceptFriendRequest(me, meData, otherUid){
    await Promise.all([
      db.ref(`friends/${me.uid}/${otherUid}`).set(true),
      db.ref(`friends/${otherUid}/${me.uid}`).set(true),
      db.ref(`friendRequests/${me.uid}/${otherUid}`).remove(),
      db.ref(`sentFriendRequests/${otherUid}/${me.uid}`).remove()
    ]);
    db.ref(`notifications/${otherUid}`).push({
      type: 'friend_accept', fromUid: me.uid, fromName: fullNameOf(meData),
      read: false, createdAt: Date.now()
    });
  }

  async function unfriend(me, otherUid){
    await Promise.all([
      db.ref(`friends/${me.uid}/${otherUid}`).remove(),
      db.ref(`friends/${otherUid}/${me.uid}`).remove()
    ]);
  }

  async function getRelationship(me, otherUid){
    const [friendSnap, sentSnap, receivedSnap, followSnap] = await Promise.all([
      db.ref(`friends/${me.uid}/${otherUid}`).get(),
      db.ref(`sentFriendRequests/${me.uid}/${otherUid}`).get(),
      db.ref(`friendRequests/${me.uid}/${otherUid}`).get(),
      db.ref(`follows/${me.uid}/following/${otherUid}`).get()
    ]);
    return {
      isFriend: friendSnap.exists(),
      requestSent: sentSnap.exists(),
      requestReceived: receivedSnap.exists(),
      isFollowing: followSnap.exists()
    };
  }

  async function countChildren(path){
    const snap = await db.ref(path).get();
    return snap.exists() ? snap.numChildren() : 0;
  }

  /* ---------------- المحادثات ---------------- */
  async function sendMessage(me, meData, otherUid, otherData, text){
    const chatId = chatIdFor(me.uid, otherUid);
    const now = Date.now();
    const myName = fullNameOf(meData);
    const otherName = fullNameOf(otherData);

    await db.ref(`chats/${chatId}/meta/members`).update({ [me.uid]: true, [otherUid]: true });
    const pushedRef = await db.ref(`chats/${chatId}/messages`).push({ from: me.uid, text, createdAt: now });

    await db.ref(`userChats/${me.uid}/${chatId}`).update({
      otherUid, otherName, otherPhoto: otherData.photoBase64 || null,
      otherVerified: !!otherData.verified,
      lastMessage: text, lastMessageAt: now, lastSenderUid: me.uid, unread: false
    });
    await db.ref(`userChats/${otherUid}/${chatId}`).update({
      otherUid: me.uid, otherName: myName, otherPhoto: meData.photoBase64 || null,
      otherVerified: !!meData.verified,
      lastMessage: text, lastMessageAt: now, lastSenderUid: me.uid, unread: true
    });
    return { chatId, messageId: pushedRef.key, createdAt: now };
  }

  function markChatRead(uid, chatId){
    db.ref(`userChats/${uid}/${chatId}/unread`).set(false);
  }

  /* ---------------- شارات الهيدر (عدد الطلبات / الرسائل غير المقروءة) ---------------- */
  function listenFriendRequestsBadge(uid, badgeEl){
    if(!badgeEl) return;
    db.ref('friendRequests/' + uid).on('value', (snap) => {
      const count = snap.exists() ? snap.numChildren() : 0;
      if(count > 0){
        badgeEl.style.display = 'flex';
        badgeEl.textContent = count > 9 ? '9+' : count;
      }else{
        badgeEl.style.display = 'none';
      }
    });
  }

  function listenUnreadChatsBadge(uid, badgeEl){
    if(!badgeEl) return;
    db.ref('userChats/' + uid).on('value', (snap) => {
      let count = 0;
      if(snap.exists()) snap.forEach(c => { if(c.val().unread) count++; });
      if(count > 0){
        badgeEl.style.display = 'flex';
        badgeEl.textContent = count > 9 ? '9+' : count;
      }else{
        badgeEl.style.display = 'none';
      }
    });
  }

  /* ---------------- الحساب الرسمي الموثّق ---------------- */
  async function getOfficialUid(){
    try{
      const snap = await db.ref('config/officialUid').get();
      return snap.exists() ? snap.val() : null;
    }catch(e){ return null; }
  }

  return {
    fullNameOf, chatIdFor,
    toggleFollow,
    sendFriendRequest, cancelFriendRequest, declineFriendRequest, acceptFriendRequest, unfriend,
    getRelationship, countChildren,
    sendMessage, markChatRead,
    listenFriendRequestsBadge, listenUnreadChatsBadge,
    getOfficialUid
  };
})();

</script>

/* ---------------- عرض الرسائل (لحظي، بأسلوب ماسنجر) ---------------- */
const chatBox = document.getElementById('chatMessages');
const scrollBottomBtn = document.getElementById('scrollBottomBtn');
const scrollBottomBadge = document.getElementById('scrollBottomBadge');
const chatTopbar = document.getElementById('chatTopbar');

const renderedMessageIds = new Set();
const pendingByMessageId = new Map(); // messageId الحقيقي -> عنصر الفقاعة المؤقتة (لحد ما توصل من السيرفر)
let lastRenderedGroupEl = null;
let lastRenderedFrom = null;
let lastRenderedAt = 0;
let lastRenderedDateKey = null;
let unseenWhileScrolledUp = 0;
let messagesLoaded = false;

function dayKey(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}
function formatDateDivider(ts){
  const today = new Date();
  const d = new Date(ts);
  const todayKey = dayKey(today.getTime());
  const yestKey = dayKey(today.getTime() - 86400000);
  const k = dayKey(ts);
  if(k === todayKey) return 'اليوم';
  if(k === yestKey) return 'أمس';
  return d.toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' });
}
function formatClock(ts){
  return new Date(ts).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
}

function isNearBottom(){
  return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 160);
}
function scrollToBottom(smooth=false){
  window.scrollTo({ top: document.body.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  unseenWhileScrolledUp = 0;
  updateScrollBottomBtn();
}
function updateScrollBottomBtn(){
  const show = !isNearBottom();
  scrollBottomBtn.classList.toggle('show', show);
  if(show && unseenWhileScrolledUp > 0){
    scrollBottomBadge.style.display = 'flex';
    scrollBottomBadge.textContent = unseenWhileScrolledUp > 9 ? '9+' : unseenWhileScrolledUp;
  }else{
    scrollBottomBadge.style.display = 'none';
  }
}
window.addEventListener('scroll', updateScrollBottomBtn);
scrollBottomBtn.addEventListener('click', () => scrollToBottom(true));

function clearEmptyState(){
  const empty = chatBox.querySelector('.chat-empty');
  if(empty) empty.remove();
}
function renderEmptyState(){
  chatBox.innerHTML = `
    <div class="chat-empty">
      <div class="chat-empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5C7.03 3.5 3 6.83 3 10.94c0 2.06 1.02 3.92 2.68 5.26-.12.98-.5 2.01-1.18 3.01a.4.4 0 0 0 .43.61c1.6-.34 2.94-.9 3.94-1.6.97.24 2.01.36 3.13.36 4.97 0 9-3.33 9-7.44S16.97 3.5 12 3.5Z"/></g></svg>
      </div>
      <div class="chat-empty-title">ابدأ المحادثة</div>
      <div class="chat-empty-sub">اكتب أول رسالة لـ ${escapeHTML([chatOtherData.firstName, chatOtherData.lastName].filter(Boolean).join(' '))} وابدأ التواصل 👋</div>
    </div>`;
}

/* بيقرر هل الرسالة دي استكمال لنفس المجموعة اللي فاتت (نفس الشخص + خلال 4 دقايق) */
function shouldContinueGroup(from, createdAt){
  return lastRenderedGroupEl && lastRenderedFrom === from && (createdAt - lastRenderedAt) < 4 * 60 * 1000;
}

/* ---------------- علامات حالة الرسالة: بيتبعت / اتبعت / اتقرأ ---------------- */
const MSG_STATUS_ICONS = {
  sending: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></g></svg>',
  sent: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.3 4.3L19.2 7"/></g></svg>',
  read: '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5l4.3 4.3L15.5 5.6"/><path d="M9.2 12.5l4.3 4.3L22 5.6"/></g></svg>',
};

// آخر وقت شاف فيه الطرف التاني المحادثة (بيتحدث لحظيًا). أي رسالة "مني" وقت
// إرسالها أقل من أو يساوي الوقت ده، معناها إنه شافها فعلاً (اتقرأت).
let otherSeenAt = 0;

function resolveMsgStatus(m){
  if(m.status === 'failed') return 'failed';
  if(m.status === 'sending') return 'sending';
  if(m.from === chatMe.uid && otherSeenAt && m.createdAt <= otherSeenAt) return 'read';
  return 'sent';
}

function applyStatusToRow(row, status){
  const icon = row.querySelector('.msg-status-icon');
  if(!icon) return;
  icon.className = 'msg-status-icon ' + status;
  icon.innerHTML = MSG_STATUS_ICONS[status] || '';
}

/* بتتفحص كل رسايلي المرسلة وتحدّث أي رسالة بقت "مقروءة" حسب otherSeenAt */
function updateReadStatuses(){
  chatBox.querySelectorAll('.msg-row.mine').forEach((row) => {
    const icon = row.querySelector('.msg-status-icon');
    if(!icon || icon.classList.contains('sending') || icon.classList.contains('failed')) return;
    if(icon.classList.contains('read')) return;
    const createdAt = Number(row.dataset.createdAt || 0);
    if(createdAt && otherSeenAt && createdAt <= otherSeenAt){
      applyStatusToRow(row, 'read');
    }
  });
}

function appendMessageBubble(m, { optimistic = false } = {}){
  clearEmptyState();

  const mine = m.from === chatMe.uid;
  const dKey = dayKey(m.createdAt);
  if(dKey !== lastRenderedDateKey){
    chatBox.insertAdjacentHTML('beforeend', `<div class="chat-date-divider"><span>${formatDateDivider(m.createdAt)}</span></div>`);
    lastRenderedDateKey = dKey;
    lastRenderedGroupEl = null; // فاصل تاريخ بيقفل أي مجموعة قبله
  }

  const continued = shouldContinueGroup(m.from, m.createdAt);

  let groupEl;
  if(continued){
    groupEl = lastRenderedGroupEl;
    // آخر صف في المجموعة مش هو الأخير دلوقتي
    const prevLast = groupEl.querySelector('.msg-row.is-last');
    if(prevLast) prevLast.classList.remove('is-last');
  }else{
    groupEl = document.createElement('div');
    groupEl.className = `msg-group ${mine ? 'mine' : 'theirs'}`;
    groupEl.innerHTML = `${!mine ? chatOtherAvatarHTML : ''}<div class="msg-stack"></div>`;
    chatBox.appendChild(groupEl);
  }

  const stack = groupEl.querySelector('.msg-stack');
  const row = document.createElement('div');
  row.className = 'msg-row is-last' + (mine ? ' mine' : ' theirs');
  row.dataset.msgId = m.id || '';
  row.dataset.createdAt = m.createdAt || '';

  const status = resolveMsgStatus(m);
  const statusHTML = mine ? `
    <div class="msg-meta">
      <span>${formatClock(m.createdAt)}</span>
      <span class="msg-status-icon ${status}">
        ${status === 'failed' ? '' : MSG_STATUS_ICONS[status]}
      </span>
      ${status === 'failed' ? '<button type="button" class="msg-retry-btn">إعادة المحاولة</button>' : ''}
    </div>` : `<div class="msg-meta"><span>${formatClock(m.createdAt)}</span></div>`;

  row.innerHTML = `
    <div class="msg-body">
      <div class="msg-bubble ${m.status === 'sending' ? 'is-sending' : ''} ${m.status === 'failed' ? 'is-failed' : ''}">${escapeHTML(m.text)}</div>
      ${statusHTML}
    </div>`;

  if(m.status === 'failed'){
    row.querySelector('.msg-retry-btn').addEventListener('click', () => retrySendMessage(row, m));
  }

  stack.appendChild(row);

  lastRenderedGroupEl = groupEl;
  lastRenderedFrom = m.from;
  lastRenderedAt = m.createdAt;

  return row;
}

function listenMessages(){
  chatBox.innerHTML = '';
  renderedMessageIds.clear();
  pendingByMessageId.clear();
  lastRenderedGroupEl = null;
  lastRenderedFrom = null;
  lastRenderedAt = 0;
  lastRenderedDateKey = null;
  messagesLoaded = false;

  const ref = db.ref(`chats/${chatId}/messages`).orderByChild('createdAt');

  ref.once('value').then((snap) => {
    if(!snap.exists() && !messagesLoaded){
      renderEmptyState();
    }
  }).catch((err) => {
    console.error(err);
    showToast('تعذر تحميل الرسائل، تحقّق من اتصالك بالإنترنت', 'error');
  });

  ref.on('child_added', (snap) => {
    const m = { id: snap.key, ...snap.val(), status: 'sent' };
    if(renderedMessageIds.has(m.id)) return;
    renderedMessageIds.add(m.id);
    messagesLoaded = true;

    const wasNearBottom = isNearBottom();

    // لو الرسالة دي كانت عندنا كـ"جارِ الإرسال" محليًا، منعرضهاش تاني، بس نأكد حالتها "اتبعتت"
    if(pendingByMessageId.has(m.id)){
      const row = pendingByMessageId.get(m.id);
      pendingByMessageId.delete(m.id);
      const bubble = row.querySelector('.msg-bubble');
      if(bubble) bubble.classList.remove('is-sending');
      row.dataset.createdAt = m.createdAt || row.dataset.createdAt;
      applyStatusToRow(row, resolveMsgStatus(m));
      return;
    }

    appendMessageBubble(m);

    if(wasNearBottom){
      scrollToBottom();
    }else if(m.from !== chatMe.uid){
      unseenWhileScrolledUp++;
    }
    updateScrollBottomBtn();

    WaselSocial.markChatRead(chatMe.uid, chatId);
  });

  ref.on('child_removed', (snap) => {
    renderedMessageIds.delete(snap.key);
  });
}

/* ---------------- إرسال رسالة (فوري على الشاشة + إعادة محاولة عند الفشل) ---------------- */
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');

function autoResizeInput(){
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
}
chatInput.addEventListener('input', () => {
  chatSendBtn.disabled = !chatInput.value.trim();
  autoResizeInput();
});
chatInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    if(chatInput.value.trim()) sendChatMessage();
  }
});
chatSendBtn.addEventListener('click', sendChatMessage);

let sendingInFlight = false;

async function sendChatMessage(){
  const text = chatInput.value.trim();
  if(!text || sendingInFlight) return;

  chatInput.value = '';
  autoResizeInput();
  chatSendBtn.disabled = true;

  await dispatchMessage(text);
}

async function dispatchMessage(text, existingRow){
  sendingInFlight = true;
  const localCreatedAt = Date.now();

  let row = existingRow;
  if(!row){
    row = appendMessageBubble({ from: chatMe.uid, text, createdAt: localCreatedAt, status: 'sending' });
    scrollToBottom();
  }else{
    // إعادة محاولة: رجّع الفقاعة لحالة "جارِ الإرسال"
    row.classList.remove('is-failed');
    const bubble = row.querySelector('.msg-bubble');
    bubble.classList.add('is-sending');
    bubble.classList.remove('is-failed');
    const meta = row.querySelector('.msg-meta');
    meta.innerHTML = `
      <span>${formatClock(localCreatedAt)}</span>
      <span class="msg-status-icon sending"><svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></g></svg></span>`;
  }

  try{
    const result = await WaselSocial.sendMessage(chatMe, chatMeData, chatOtherUid, chatOtherData, text);
    // اربط الرسالة الحقيقية اللي جاية من السيرفر بالفقاعة المؤقتة عشان ما تتكررش
    if(result && result.messageId){
      if(renderedMessageIds.has(result.messageId)){
        // وصلت فعلاً عن طريق child_added قبل ما نوصل هنا: امسح الفقاعة المؤقتة
        row.remove();
      }else{
        renderedMessageIds.add(result.messageId);
        pendingByMessageId.set(result.messageId, row);
        row.dataset.msgId = result.messageId;
        const bubble = row.querySelector('.msg-bubble');
        const statusIcon = row.querySelector('.msg-status-icon');
        if(bubble) bubble.classList.remove('is-sending');
        if(statusIcon){
          statusIcon.classList.remove('sending');
          statusIcon.classList.add('sent');
          statusIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.3 4.3L19.2 7"/></g></svg>';
        }
      }
    }
  }catch(err){
    console.error(err);
    markMessageFailed(row, text);
    showToast('تعذر إرسال الرسالة، تحقّق من اتصالك بالإنترنت', 'error');
  }finally{
    sendingInFlight = false;
  }
}

function markMessageFailed(row, text){
  const bubble = row.querySelector('.msg-bubble');
  bubble.classList.remove('is-sending');
  bubble.classList.add('is-failed');
  const meta = row.querySelector('.msg-meta');
  meta.innerHTML = `
    <span>${formatClock(Date.now())}</span>
    <span class="msg-status-icon failed"></span>
    <button type="button" class="msg-retry-btn">إعادة المحاولة</button>`;
  meta.querySelector('.msg-retry-btn').addEventListener('click', () => retrySendMessage(row, { text }));
}

function retrySendMessage(row, m){
  dispatchMessage(m.text, row);
}

</script>
