<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واصل — محادثة</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
<div class="auth-gate"><div class="spinner dark"></div></div>

<div class="chat-topbar">
  <a href="messages.html" class="back-btn" style="background:var(--bg);border:none;width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a href="#" id="chatOtherProfileLink" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
    <div class="avatar avatar-sm" id="chatOtherAvatar"></div>
    <div class="chat-topbar-name" id="chatOtherName">...</div>
  </a>
</div>

<main class="chat-messages" id="chatMessages">
  <div class="skeleton" style="height:40px;width:60%;margin-bottom:10px;border-radius:16px;"></div>
  <div class="skeleton" style="height:40px;width:50%;margin-right:auto;margin-bottom:10px;border-radius:16px;"></div>
</main>

<div class="chat-input-bar">
  <div class="chat-input-bar-inner">
    <input type="text" id="chatInput" placeholder="اكتب رسالة..." maxlength="2000" autocomplete="off">
    <button class="chat-send-btn" id="chatSendBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 12 12)"/></svg>
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/common.js"></script>
<script src="js/social.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
