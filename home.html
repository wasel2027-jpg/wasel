<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{if(localStorage.getItem("waselTheme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
<title>واصل — الرئيسية</title>
<style>
/* =========================================================
   واصل (Wasel) — نظام التصميم المشترك
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap');

:root{
  /* الألوان */
  --bg: #F5F4FB;
  --surface: #FFFFFF;
  --surface-2: #FBFAFF;
  --ink: #1A1B3A;
  --ink-soft: #4A4B6A;
  --muted: #83839E;
  --border: #E6E4F4;
  --border-soft: #EFEEF8;

  --primary: #5B4FE8;
  --primary-dark: #453BC4;
  --primary-tint: #EEECFD;

  --accent: #FF6B5B;      /* لايك / تنبيهات */
  --accent-tint: #FFE9E5;

  --success: #22B27D;     /* حفظ / تأكيد */
  --success-tint: #E1F7EE;

  --gold: #E8A33D;        /* شارات ثانوية */

  --shadow-sm: 0 1px 2px rgba(26,27,58,.06);
  --shadow-md: 0 8px 24px rgba(26,27,58,.10);
  --shadow-lg: 0 20px 48px rgba(26,27,58,.16);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;
}

/* ============ الوضع الليلي ============ */
:root[data-theme="dark"]{
  --bg:#14152B; --surface:#1E1F3C; --surface-2:#252747; --ink:#F1F0FB; --ink-soft:#C7C6E8;
  --muted:#8E8DB4; --border:#34365E; --border-soft:#2A2C50;
  --primary-tint:#2B2A56; --accent-tint:#3A2530; --success-tint:#153A2C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 20px 48px rgba(0,0,0,.45);
}
:root[data-theme="dark"] .app-header{background:rgba(30,31,60,.92);}
:root[data-theme="dark"] .brand,
:root[data-theme="dark"] .avatar,
:root[data-theme="dark"] .icon-btn:hover,
:root[data-theme="dark"] .select-chip.active,
:root[data-theme="dark"] .drawer-nav-icon,
:root[data-theme="dark"] .btn-icon-circle:hover{
  color:#BAB2FF;
}
:root[data-theme="dark"] ::selection{ background:var(--primary-tint); color:#BAB2FF; }
:root[data-theme="dark"] .btn-primary:disabled,
:root[data-theme="dark"] .chat-send-btn:disabled{ background:#39396B; color:#8E8DB4; }
:root[data-theme="dark"] img{ filter:brightness(.93); }
:root[data-theme="dark"] ::-webkit-scrollbar-thumb{ background:var(--border); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  direction:rtl;
  font-family:'Tajawal', sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.brand{font-family:'Almarai', sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
input,textarea,select{font-family:inherit;}

::selection{background:var(--primary-tint);color:var(--primary-dark);}

/* ============ شعار العلامة (الإشارة البصرية المميزة) ============ */
.brand-mark{
  width:38px;height:38px;flex:0 0 auto;position:relative;
}
.brand-mark svg{width:100%;height:100%;display:block;}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:22px;color:var(--primary-dark);
  letter-spacing:-.3px;
}

/* ============ أزرار ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:var(--radius-pill);border:none;
  font-weight:700;font-size:15px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(91,79,232,.30);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#C9C6EE;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--primary-tint);border-color:var(--primary-tint);}
.btn-block{width:100%;}
.btn-text{background:none;border:none;color:var(--primary);font-weight:700;padding:6px 4px;}

/* ============ حقول الإدخال ============ */
.field{margin-bottom:18px;text-align:right;}
.field label{
  display:block;font-size:13px;font-weight:700;color:var(--ink-soft);
  margin-bottom:7px;
}
.field .req{color:var(--accent);}
.field-input{
  width:100%;padding:14px 16px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--surface-2);
  font-size:15px;color:var(--ink);transition:border-color .15s, background .15s;
}
.field-input:focus{outline:none;border-color:var(--primary);background:var(--surface);}
.field-input::placeholder{color:var(--muted);opacity:1;}
.field-hint{font-size:12px;color:var(--muted);margin-top:6px;}
.field-error{font-size:12px;color:var(--accent);margin-top:6px;display:none;font-weight:700;}
.field.has-error .field-input{border-color:var(--accent);background:var(--accent-tint);}
.field.has-error .field-error{display:block;}

.select-group{display:flex;gap:10px;}
.select-chip{
  flex:1;padding:14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface-2);text-align:center;font-weight:700;color:var(--ink-soft);
  transition:all .15s;
}
.select-chip.active{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-dark);}

/* ============ بطاقات ============ */
.card{
  background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);
}

/* ============ تنبيه توست ============ */
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--radius-pill);
  font-size:14px;font-weight:700;box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease;
}
.toast.success{background:var(--success);}
.toast.error{background:var(--accent);}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* ============ سكيلتون تحميل ============ */
.skeleton{background:linear-gradient(90deg,#EEEDF8 25%,#F6F5FC 37%,#EEEDF8 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ============ هيدر عام (داخلي/فوتر تنقل) ============ */
.app-header{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.app-header-inner{
  max-width:1100px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.header-search{
  flex:1;max-width:420px;display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1.5px solid transparent;border-radius:var(--radius-pill);
  padding:10px 16px;color:var(--muted);transition:border-color .15s;
}
.header-search:hover,.header-search:focus-within{border-color:var(--border);}
.header-search input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:var(--bg);
  display:flex;align-items:center;justify-content:center;position:relative;
  color:var(--ink-soft);transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--primary-tint);color:var(--primary-dark);}
.icon-btn .badge{
  position:absolute;top:-2px;left:-2px;background:var(--accent);color:#fff;
  font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface);
}
.avatar{
  border-radius:50%;object-fit:cover;background:var(--primary-tint);
  display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-weight:800;
  overflow:hidden;flex:0 0 auto;
}
.avatar-sm{width:38px;height:38px;font-size:15px;}
.avatar-md{width:48px;height:48px;font-size:18px;}
.avatar-lg{width:96px;height:96px;font-size:32px;border:4px solid var(--surface);box-shadow:var(--shadow-md);}
.avatar-xl{width:128px;height:128px;font-size:40px;border:5px solid var(--surface);box-shadow:var(--shadow-md);}

/* ============ تجميعة أيقونات الهيدر (رسائل/إشعارات/بروفايل) + زر القائمة للموبايل ============ */
.header-actions-desktop{display:flex;align-items:center;gap:8px;}
.menu-toggle-btn{display:none;}
@media (max-width:680px){
  .header-actions-desktop{display:none;}
  .menu-toggle-btn{display:flex;}
}

/* ============ القائمة الجانبية (Drawer) ============ */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(26,27,58,.45);z-index:1200;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.side-drawer{
  position:fixed;top:0;bottom:0;right:0;width:82%;max-width:320px;background:var(--surface);
  z-index:1201;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s ease;
  display:flex;flex-direction:column;overflow-y:auto;
}
.side-drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:flex-end;padding:14px 14px 0;}
.drawer-close-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
.drawer-profile{display:flex;align-items:center;gap:12px;padding:6px 18px 16px;border-bottom:1px solid var(--border-soft);}
.drawer-profile-name{font-weight:800;font-size:15.5px;}
.drawer-profile-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.drawer-nav{padding:10px;flex:1;}
.drawer-nav-item{
  display:flex;align-items:center;gap:14px;padding:13px 10px;border-radius:12px;font-weight:700;
  font-size:14.5px;color:var(--ink);position:relative;width:100%;background:none;border:none;text-align:right;font-family:inherit;
}
.drawer-nav-item:hover{background:var(--bg);}
.drawer-nav-icon{width:36px;height:36px;border-radius:10px;background:var(--primary-tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.drawer-nav-item .badge{position:static;margin-inline-start:auto;border:none;}
.drawer-nav-item.danger{color:var(--accent);}
.drawer-nav-item.danger .drawer-nav-icon{background:var(--accent-tint);color:var(--accent);}
.drawer-divider{height:1px;background:var(--border-soft);margin:8px 6px;}

/* ============ حاوية الصفحة ============ */
.page-container{max-width:640px;margin:0 auto;padding:20px 14px 90px;}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

/* ============ مؤشر تحميل ============ */
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
.spinner.dark{border:2.5px solid var(--border);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* ============ بوابة التحقق من تسجيل الدخول ============
   بتمنع ظهور أي محتوى في الصفحة قبل ما نتأكد إن فيه جلسة
   صحيحة ومش محظورة، عشان محدش يشوف الصفحة الرئيسية أو أي
   صفحة محمية غير وهو داخل بحساب فعلاً.                     */
body.auth-pending > *:not(.auth-gate){
  display:none !important;
}
.auth-gate{
  position:fixed;inset:0;z-index:99999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}

@media (max-width:480px){
  .header-search{display:none;}
}

/* ============ شارة التوثيق (الحساب الموثّق) ============ */
.verified-badge{vertical-align:-2.5px;margin-inline-start:4px;flex:0 0 auto;}
.name-with-badge{display:inline-flex;align-items:center;}

/* ============ أزرار العلاقة في البروفايل (متابعة/صداقة/رسالة) ============ */
.profile-actions{display:flex;gap:10px;margin:14px 0 18px;}
.profile-actions .btn{padding:11px 18px;font-size:13.5px;flex:1;}
.btn-icon-circle{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto !important;padding:0 !important;
  display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink-soft);border:none;
}
.btn-icon-circle:hover{background:var(--primary-tint);color:var(--primary-dark);}
.btn-friend-pending{background:var(--surface-2);color:var(--ink-soft);border:1.5px solid var(--border);}
.btn-friend-accept{background:var(--success);color:#fff;}
.profile-counts{display:flex;gap:18px;margin:2px 0 10px;font-size:13px;color:var(--ink-soft);}
.profile-counts b{color:var(--ink);font-weight:800;}

/* ============ اقتراح متابعة الحساب الرسمي ============ */
.official-suggest{
  display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px;
}
.official-suggest .avatar{background:var(--primary);color:#fff;}
.official-suggest-text{flex:1;}
.official-suggest-title{font-weight:800;font-size:14px;display:flex;align-items:center;}
.official-suggest-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ============ أشخاص تعرفهم (اقتراحات صداقة) ============ */
.people-you-may-know{padding:16px 0 6px;margin-bottom:16px;}
.pymk-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;}
.pymk-title{font-weight:800;font-size:15px;}
.pymk-see-all{font-size:12.5px;font-weight:700;color:var(--primary);}
.pymk-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.pymk-scroll::-webkit-scrollbar{display:none;}
.pymk-item{flex:0 0 auto;width:132px;border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:12px 10px;text-align:center;background:var(--surface-2);}
.pymk-item .avatar{margin:0 auto 8px;}
.pymk-name{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pymk-meta{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px;}
.pymk-add-btn{width:100%;margin-top:9px;padding:8px;font-size:12.5px;}

/* ============ قائمة المحادثات ============ */
.chat-item{
  display:flex;align-items:center;gap:13px;padding:13px 8px;border-radius:12px;position:relative;
}
.chat-item:hover{background:var(--surface-2);}
.chat-item-info{flex:1;min-width:0;}
.chat-item-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;}
.chat-item-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chat-item-preview.unread{color:var(--ink);font-weight:700;}
.chat-item-time{font-size:11px;color:var(--muted);flex:0 0 auto;align-self:flex-start;margin-top:2px;}
.chat-unread-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);flex:0 0 auto;}
.empty-chats{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-chats svg{margin-bottom:14px;opacity:.5;}

/* ============ صفحة محادثة فردية ============ */
.chat-topbar{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);padding:10px 14px;display:flex;align-items:center;gap:12px;
}
.chat-topbar-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;}
.chat-messages{max-width:640px;margin:0 auto;padding:16px 14px 100px;min-height:60vh;}
.msg-row{display:flex;margin-bottom:10px;}
.msg-row.mine{justify-content:flex-start;}
.msg-row.theirs{justify-content:flex-end;}
.msg-bubble{max-width:72%;padding:10px 15px;border-radius:18px;font-size:14.5px;line-height:1.6;word-break:break-word;}
.msg-row.mine .msg-bubble{background:var(--primary);color:#fff;border-bottom-left-radius:5px;}
.msg-row.theirs .msg-bubble{background:var(--surface-2);border:1px solid var(--border-soft);border-bottom-right-radius:5px;}
.msg-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:center;}
.chat-input-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border-soft);
  padding:10px 14px;display:flex;gap:10px;align-items:center;
}
.chat-input-bar-inner{max-width:640px;margin:0 auto;display:flex;gap:10px;width:100%;}
.chat-input-bar input{
  flex:1;border:1.5px solid var(--border);background:var(--surface-2);border-radius:var(--radius-pill);
  padding:12px 18px;font-size:14.5px;outline:none;
}
.chat-input-bar input:focus{border-color:var(--primary);background:var(--surface);}
.chat-send-btn{
  width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.chat-send-btn:disabled{background:#C9C6EE;}

/* ============ طلبات الصداقة ============ */
.freq-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border-soft);}
.freq-item{display:flex;align-items:center;gap:13px;padding:13px;margin-bottom:10px;}
.freq-item-info{flex:1;min-width:0;}
.freq-item-name{font-weight:800;font-size:14.5px;display:flex;align-items:center;}
.freq-item-time{font-size:12px;color:var(--muted);margin-top:2px;}
.freq-actions{display:flex;gap:8px;flex:0 0 auto;}
.freq-actions .btn{padding:9px 14px;font-size:12.5px;}
.btn-decline{background:var(--bg);color:var(--ink-soft);}
.empty-freq{text-align:center;padding:50px 20px;color:var(--muted);}

</style>

  .modal-head h3{margin:0;font-size:17px;}

  .modal-author{display:flex;align-items:center;gap:10px;margin-bottom:14px;}

  }
  .modal-image-preview{position:relative;margin-top:10px;border-radius:var(--radius-md);overflow:hidden;display:none;}
  .modal-image-preview img{width:100%;max-height:320px;object-fit:cover;}
  .remove-image{
    position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;

<script>
// =========================================================
// ملف الربط المركزي بين كل الصفحات — واصل (Wasel)
// كل صفحة بتقرأ بيانات المستخدم اللي داخل بيها من هنا بدل ما
// كل صفحة تعمل استعلام لوحدها لقاعدة البيانات من الأول.
// =========================================================
const WaselSession = (function(){
  let cachedUser = null;
  let cachedData = null;
  let initialized = false;
  let readyQueue = [];

  const STORAGE_KEY = 'wasel_session_cache';

  function saveToTabCache(uid, data){
    try{
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ uid, data, savedAt: Date.now() }));
    }catch(e){ /* تجاهل لو التخزين ممتلئ */ }
  }

  function readFromTabCache(uid){
    try{
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(parsed.uid === uid) return parsed.data;
    }catch(e){}
    return null;
  }

  function clearTabCache(){
    try{ sessionStorage.removeItem(STORAGE_KEY); }catch(e){}
  }

  function resolveReady(user, data){
    initialized = true;
    cachedUser = user;
    cachedData = data;
    readyQueue.forEach(cb => cb(user, data));
    readyQueue = [];
  }

  auth.onAuthStateChanged(async (user) => {
    if(!user){
      clearTabCache();
      resolveReady(null, null);
      return;
    }

    const fromCache = readFromTabCache(user.uid);
    if(fromCache){
      resolveReady(user, fromCache);
      return;
    }

    try{
      const snap = await db.ref('users/' + user.uid).get();
      let data = snap.exists() ? snap.val() : null;

      // شبكة أمان: مستخدم عنده حساب دخول (Auth) بس بياناته مش موجودة في قاعدة
      // البيانات (غالبًا بسبب مشكلة قديمة وقت التسجيل) — نعمّر له سجل أساسي
      // بدل ما يفضل يشوف "المستخدم غير موجود" في كل الصفحات
      if(!data){
        const fallback = {
          firstName: (user.displayName || 'مستخدم واصل').split(' ')[0],
          lastName: null,
          email: user.email && !user.email.endsWith('@wasel.app') ? user.email : null,
          phone: user.email && user.email.endsWith('@wasel.app') ? user.email.split('@')[0] : null,
          gender: 'male',
          birthDate: null,
          photoBase64: null,
          blocked: false,
          createdAt: Date.now(),
          lastLogin: Date.now()
        };
        try{
          await db.ref('users/' + user.uid).set(fallback);
          data = fallback;
        }catch(e){
          console.error('تعذر إنشاء بيانات المستخدم المفقودة تلقائيًا:', e);
        }
      }

      saveToTabCache(user.uid, data);
      resolveReady(user, data);
    }catch(err){
      console.error(err);
      resolveReady(user, null);
    }
  });

  return {
    /* بيتنفذ فورًا لو البيانات جاهزة، أو بيستنى لحد ما تجهز */
    onReady(callback){
      if(initialized) callback(cachedUser, cachedData);
      else readyQueue.push(callback);
    },

    getUser(){ return cachedUser; },
    getUserData(){ return cachedData; },

    /* لو صفحة عدّلت بيانات المستخدم (زي تغيير صورة البروفايل)
       تنادي الدالة دي عشان باقي الصفحات تاخد النسخة الجديدة   */
    updateCachedData(patch){
      if(!cachedUser) return;
      cachedData = { ...(cachedData || {}), ...patch };
      saveToTabCache(cachedUser.uid, cachedData);
    },

    refreshFromServer(){
      if(!cachedUser) return Promise.resolve(null);
      return db.ref('users/' + cachedUser.uid).get().then(snap => {
        const data = snap.exists() ? snap.val() : null;
        saveToTabCache(cachedUser.uid, data);
        cachedData = data;
        return data;
      });
    },

    /* ---------- تذكرني: حفظ البريد/الهاتف اللي دخل بيه بس (مش كلمة السر) ---------- */
    setRememberedIdentifier(identifier){
      try{ localStorage.setItem('wasel_remembered_identifier', identifier); }catch(e){}
    },
    clearRememberedIdentifier(){
      try{ localStorage.removeItem('wasel_remembered_identifier'); }catch(e){}
    },
    getRememberedIdentifier(){
      try{ return localStorage.getItem('wasel_remembered_identifier') || ''; }catch(e){ return ''; }
    }
  };
})();

</script>
<script>
// =========================================================
// أدوات مشتركة — واصل (Wasel)
// =========================================================

/* ---------- توست ---------- */
function ensureToastWrap(){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  return wrap;
}
function showToast(message, type=''){
  const wrap = ensureToastWrap();
  const el = document.createElement('div');
  el.className = `toast ${type}`.trim();
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

/* ---------- الأحرف الأولى كافاتار افتراضي ---------- */
function initialsOf(name){
  if(!name) return '؟';
  const parts = name.trim().split(' ');
  return parts[0] ? parts[0][0] : '؟';
}

/* ---------- حساب السن للتأكد من 18+ ---------- */
function calcAge(birthDateStr){
  const today = new Date();
  const birth = new Date(birthDateStr);
  let age = today.getFullYear() - birth.getFullYear();
  const m = today.getMonth() - birth.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
  return age;
}

/* ---------- وقت نسبي ---------- */
function timeAgo(timestamp){
  const diff = Math.floor((Date.now() - timestamp) / 1000);
  if(diff < 60) return 'الآن';
  if(diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  if(diff < 86400) return `منذ ${Math.floor(diff/3600)} س`;
  if(diff < 2592000) return `منذ ${Math.floor(diff/86400)} يوم`;
  return new Date(timestamp).toLocaleDateString('ar-EG');
}

/* ---------- ضغط الصور قبل رفعها لقاعدة البيانات ----------
   قاعدة البيانات لسة ضعيفة، فبنضغط أي صورة (بروفايل أو منشور)
   وبنحولها base64 بحجم محدود بدل ما نستخدم Storage خارجي.        */
function compressImage(file, maxWidth = 800, quality = 0.7){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith('image/')){
      reject(new Error('الملف مش صورة'));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxWidth){
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const base64 = canvas.toDataURL('image/jpeg', quality);
        resolve(base64);
      };
      img.onerror = () => reject(new Error('تعذر تحميل الصورة'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('تعذر قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

// أقصى حجم مسموح به لصورة المنشور بعد الضغط (تقريبًا)
const MAX_POST_IMAGE_BYTES = 350 * 1024; // ~350KB
function base64SizeBytes(base64){
  const clean = base64.split(',')[1] || base64;
  return Math.ceil((clean.length * 3) / 4);
}

/* ---------- حماية الصفحات: لازم يكون المستخدم مسجل دخول ----------
   البيانات بتتقرأ من WaselSession (js/session.js) اللي بيقرأها
   مرة واحدة بس ويشاركها بين كل الصفحات بدل ما كل صفحة تستعلم لوحدها.
   الصفحة بتفضل مخفية تمامًا (body.auth-pending) لحد ما نتأكد
   إن فيه جلسة صحيحة، عشان محدش يشوف حتى ومضة من المحتوى قبل التحقق. */
function requireAuth(onReady){
  WaselSession.onReady(async (user, data) => {
    if(!user){
      window.location.href = 'login.html';
      return;
    }
    if(data && data.blocked){
      await auth.signOut();
      showToast('تم إيقاف هذا الحساب', 'error');
      setTimeout(()=> window.location.href = 'login.html', 1200);
      return;
    }
    revealProtectedPage();
    onReady(user, data);
  });
}

function revealProtectedPage(){
  document.body.classList.remove('auth-pending');
  const gate = document.querySelector('.auth-gate');
  if(gate) gate.remove();
}

/* ---------- تسجيل الخروج ---------- */
function logout(){
  auth.signOut().then(() => window.location.href = 'login.html');
}

/* ---------- شارة التوثيق (تظهر جنب اسم أي حساب موثّق زي حساب واصل الرسمي) ---------- */
function verifiedBadgeHTML(){
  return `<svg class="verified-badge" width="15" height="15" viewBox="0 0 24 24" fill="none" title="حساب موثّق"><path d="M12 2.2l2.1 1.4 2.5-.6 1.3 2.2 2.3 1.1-.3 2.5 1.6 2-1.6 2 .3 2.5-2.3 1.1-1.3 2.2-2.5-.6L12 21.8l-2.1-1.4-2.5.6-1.3-2.2-2.3-1.1.3-2.5-1.6-2 1.6-2-.3-2.5 2.3-1.1 1.3-2.2 2.5.6Z" fill="#5B4FE8" stroke="none"/><path d="M8.3 12.2l2.4 2.4 5-5.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
}
function nameWithBadge(name, isVerified){
  return `<span class="name-with-badge">${escapeHTML(name || '')}${isVerified ? verifiedBadgeHTML() : ''}</span>`;
}

/* ---------- تهريب النصوص من HTML (مشتركة لكل الصفحات) ---------- */
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ---------- تطبيع النص العربي (مستخدمة في مقارنة المدينة لاقتراحات الصداقة) ---------- */
function normalizeArabic(str){
  return (str || '')
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
    .replace(/\u0640/g, '')
    .replace(/[إأآا]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ة/g, 'ه')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي');
}
function normalizeForSearch(str){
  return normalizeArabic((str || '').trim().toLowerCase());
}

<script>
// =========================================================
// منطق العلاقات المشترك — واصل (Wasel)
// المتابعة، طلبات الصداقة، والمحادثات — تستخدمه أي صفحة
// تحتاج تتعامل مع علاقات المستخدمين مع بعض.
// =========================================================
const WaselSocial = (function(){

  function fullNameOf(data){
    return [data && data.firstName, data && data.lastName].filter(Boolean).join(' ');
  }

  function chatIdFor(a, b){
    return [a, b].sort().join('_');
  }

  /* ---------------- المتابعة ---------------- */
  async function toggleFollow(me, meData, otherUid){
    const ref = db.ref(`follows/${me.uid}/following/${otherUid}`);
    const snap = await ref.get();
    if(snap.exists()){
      await Promise.all([
        ref.remove(),
        db.ref(`follows/${otherUid}/followers/${me.uid}`).remove()
      ]);
      return false;
    }
    await Promise.all([
      ref.set(true),
      db.ref(`follows/${otherUid}/followers/${me.uid}`).set(true)
    ]);
    if(otherUid !== me.uid){
      db.ref(`notifications/${otherUid}`).push({
        type: 'follow', fromUid: me.uid, fromName: fullNameOf(meData),
        read: false, createdAt: Date.now()
      });
    }
    return true;
  }

  /* ---------------- طلبات الصداقة ---------------- */
  async function sendFriendRequest(me, meData, otherUid){
    await Promise.all([
      db.ref(`friendRequests/${otherUid}/${me.uid}`).set({
        fromName: fullNameOf(meData), fromPhoto: meData.photoBase64 || null, createdAt: Date.now()
      }),
      db.ref(`sentFriendRequests/${me.uid}/${otherUid}`).set(true)
    ]);
    db.ref(`notifications/${otherUid}`).push({
      type: 'friend_request', fromUid: me.uid, fromName: fullNameOf(meData),
      read: false, createdAt: Date.now()
    });
  }

  async function cancelFriendRequest(me, otherUid){
    await Promise.all([
      db.ref(`friendRequests/${otherUid}/${me.uid}`).remove(),
      db.ref(`sentFriendRequests/${me.uid}/${otherUid}`).remove()
    ]);
  }

  async function declineFriendRequest(me, otherUid){
    await Promise.all([
      db.ref(`friendRequests/${me.uid}/${otherUid}`).remove(),
      db.ref(`sentFriendRequests/${otherUid}/${me.uid}`).remove()
    ]);
  }

  async function acceptFriendRequest(me, meData, otherUid){
    await Promise.all([
      db.ref(`friends/${me.uid}/${otherUid}`).set(true),
      db.ref(`friends/${otherUid}/${me.uid}`).set(true),
      db.ref(`friendRequests/${me.uid}/${otherUid}`).remove(),
      db.ref(`sentFriendRequests/${otherUid}/${me.uid}`).remove()
    ]);
    db.ref(`notifications/${otherUid}`).push({
      type: 'friend_accept', fromUid: me.uid, fromName: fullNameOf(meData),
      read: false, createdAt: Date.now()
    });
  }

  async function unfriend(me, otherUid){
    await Promise.all([
      db.ref(`friends/${me.uid}/${otherUid}`).remove(),
      db.ref(`friends/${otherUid}/${me.uid}`).remove()
    ]);
  }

  async function getRelationship(me, otherUid){
    const [friendSnap, sentSnap, receivedSnap, followSnap] = await Promise.all([
      db.ref(`friends/${me.uid}/${otherUid}`).get(),
      db.ref(`sentFriendRequests/${me.uid}/${otherUid}`).get(),
      db.ref(`friendRequests/${me.uid}/${otherUid}`).get(),
      db.ref(`follows/${me.uid}/following/${otherUid}`).get()
    ]);
    return {
      isFriend: friendSnap.exists(),
      requestSent: sentSnap.exists(),
      requestReceived: receivedSnap.exists(),
      isFollowing: followSnap.exists()
    };
  }

  async function countChildren(path){
    const snap = await db.ref(path).get();
    return snap.exists() ? snap.numChildren() : 0;
  }

  /* ---------------- المحادثات ---------------- */
  async function sendMessage(me, meData, otherUid, otherData, text){
    const chatId = chatIdFor(me.uid, otherUid);
    const now = Date.now();
    const myName = fullNameOf(meData);
    const otherName = fullNameOf(otherData);

    await db.ref(`chats/${chatId}/meta/members`).update({ [me.uid]: true, [otherUid]: true });
    await db.ref(`chats/${chatId}/messages`).push({ from: me.uid, text, createdAt: now });

    await db.ref(`userChats/${me.uid}/${chatId}`).update({
      otherUid, otherName, otherPhoto: otherData.photoBase64 || null,
      otherVerified: !!otherData.verified,
      lastMessage: text, lastMessageAt: now, lastSenderUid: me.uid, unread: false
    });
    await db.ref(`userChats/${otherUid}/${chatId}`).update({
      otherUid: me.uid, otherName: myName, otherPhoto: meData.photoBase64 || null,
      otherVerified: !!meData.verified,
      lastMessage: text, lastMessageAt: now, lastSenderUid: me.uid, unread: true
    });
    return chatId;
  }

  function markChatRead(uid, chatId){
    db.ref(`userChats/${uid}/${chatId}/unread`).set(false);
  }

  /* ---------------- شارات الهيدر (عدد الطلبات / الرسائل غير المقروءة) ---------------- */
  function setBadges(badgeEls, count){
    const els = (Array.isArray(badgeEls) ? badgeEls : [badgeEls]).filter(Boolean);
    els.forEach(badgeEl => {
      if(count > 0){
        badgeEl.style.display = 'flex';
        badgeEl.textContent = count > 9 ? '9+' : count;
      }else{
        badgeEl.style.display = 'none';
      }
    });
  }

  function listenFriendRequestsBadge(uid, badgeEls){
    if(!badgeEls) return;
    db.ref('friendRequests/' + uid).on('value', (snap) => {
      setBadges(badgeEls, snap.exists() ? snap.numChildren() : 0);
    });
  }

  function listenUnreadChatsBadge(uid, badgeEls){
    if(!badgeEls) return;
    db.ref('userChats/' + uid).on('value', (snap) => {
      let count = 0;
      if(snap.exists()) snap.forEach(c => { if(c.val().unread) count++; });
      setBadges(badgeEls, count);
    });
  }

  /* ---------------- الحساب الرسمي الموثّق ---------------- */
  async function getOfficialUid(){
    try{
      const snap = await db.ref('config/officialUid').get();
      return snap.exists() ? snap.val() : null;
    }catch(e){ return null; }
  }

  return {
    fullNameOf, chatIdFor,
    toggleFollow,
    sendFriendRequest, cancelFriendRequest, declineFriendRequest, acceptFriendRequest, unfriend,
    getRelationship, countChildren,
    sendMessage, markChatRead,
    listenFriendRequestsBadge, listenUnreadChatsBadge,
    getOfficialUid
  };
})();

</script>
<script>
// =========================================================
// منطق الصفحة الرئيسية — واصل (Wasel)
// =========================================================
let currentUser = null;
let currentUserData = null;
let composerImageBase64 = null;

function avatarHTML(el, userData){
  if(userData && userData.photoBase64){
    el.style.backgroundImage = `url(${userData.photoBase64})`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
    el.textContent = '';
  }else{
    el.textContent = initialsOf(userData ? userData.firstName : '');
  }
}

requireAuth((user, userData) => {
  currentUser = user;
  currentUserData = userData || {};
  avatarHTML(document.getElementById('headerAvatar'), currentUserData);
  avatarHTML(document.getElementById('composerAvatar'), currentUserData);
  avatarHTML(document.getElementById('modalAvatar'), currentUserData);
  avatarHTML(document.getElementById('drawerAvatar'), currentUserData);
  document.getElementById('modalName').textContent = [currentUserData.firstName, currentUserData.lastName].filter(Boolean).join(' ');
  document.getElementById('drawerName').textContent = [currentUserData.firstName, currentUserData.lastName].filter(Boolean).join(' ');
  listenNotifications();
  listenFeed();
  WaselSocial.listenFriendRequestsBadge(currentUser.uid, [document.getElementById('friendReqBadge'), document.getElementById('friendReqBadgeDrawer')]);
  WaselSocial.listenUnreadChatsBadge(currentUser.uid, [document.getElementById('msgBadge'), document.getElementById('msgBadgeDrawer')]);
  loadOfficialSuggestion();
  loadPeopleYouMayKnow();
});

/* ---------------- القائمة الجانبية (Drawer) ---------------- */
(function initDrawer(){
  const overlay = document.getElementById('drawerOverlay');
  const drawer = document.getElementById('sideDrawer');
  const openBtn = document.getElementById('menuToggleBtn');
  const closeBtn = document.getElementById('drawerCloseBtn');
  function openDrawer(){ overlay.classList.add('open'); drawer.classList.add('open'); }
  function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
  openBtn.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
  document.getElementById('drawerLogoutBtn').addEventListener('click', () => { closeDrawer(); logout(); });
})();

/* ---------------- اقتراح متابعة الحساب الرسمي ---------------- */
async function loadOfficialSuggestion(){
  const officialUid = await WaselSocial.getOfficialUid();
  if(!officialUid || officialUid === currentUser.uid) return;
  const [userSnap, followSnap] = await Promise.all([
    db.ref('users/' + officialUid).get(),
    db.ref(`follows/${currentUser.uid}/following/${officialUid}`).get()
  ]);
  if(!userSnap.exists() || followSnap.exists()) return; // إما الحساب مش موجود أو المستخدم متابعه بالفعل

  const u = userSnap.val();
  const fullName = [u.firstName, u.lastName].filter(Boolean).join(' ');
  const card = document.getElementById('officialSuggest');
  avatarHTML(document.getElementById('officialSuggestAvatar'), u);
  document.getElementById('officialSuggestName').innerHTML = nameWithBadge(fullName, true);
  card.href = 'profile.html?uid=' + officialUid;
  card.style.display = 'flex';

  document.getElementById('officialSuggestBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.disabled = true;
    try{
      await WaselSocial.toggleFollow(currentUser, currentUserData, officialUid);
      showToast('تمت متابعة حساب واصل', 'success');
      card.style.display = 'none';
    }catch(err){
      btn.disabled = false;
      showToast('تعذرت المتابعة', 'error');
    }
  });
}

/* ---------------- أشخاص تعرفهم (نفس منطق اقتراحات الصداقة في صفحة طلبات الصداقة) ----------------
   بيرتب المقترحين بالأصدقاء المشتركين من الأعلى للأقل، وبعدين بنفس
   المحافظة/المدينة/الدولة — وبيعرض أول 8 بس هنا مع رابط "عرض الكل". */
async function computeFriendSuggestions(me, meData){
  const [friendsSnap, usersSnap, receivedSnap, sentSnap] = await Promise.all([
    db.ref('friends/' + me.uid).get(),
    db.ref('users').get(),
    db.ref('friendRequests/' + me.uid).get(),
    db.ref('sentFriendRequests/' + me.uid).get()
  ]);

  const myFriends = friendsSnap.exists() ? Object.keys(friendsSnap.val()) : [];
  const myFriendsSet = new Set(myFriends);
  const receivedSet = receivedSnap.exists() ? new Set(Object.keys(receivedSnap.val())) : new Set();
  const sentSet = sentSnap.exists() ? new Set(Object.keys(sentSnap.val())) : new Set();

  const allUsers = {};
  if(usersSnap.exists()) usersSnap.forEach(c => { allUsers[c.key] = c.val(); });

  const mutualCountMap = {};
  const friendsOfFriendsSnaps = await Promise.all(myFriends.map(fid => db.ref('friends/' + fid).get()));
  friendsOfFriendsSnaps.forEach(snap => {
    if(!snap.exists()) return;
    Object.keys(snap.val()).forEach(uid => {
      if(uid === me.uid) return;
      mutualCountMap[uid] = (mutualCountMap[uid] || 0) + 1;
    });
  });

  const candidateIds = new Set(Object.keys(mutualCountMap));
  const haveLocation = !!(meData.city || meData.governorate || meData.country);
  if(haveLocation){
    Object.keys(allUsers).forEach(uid => {
      const u = allUsers[uid];
      const sameCity = meData.city && u.city && normalizeForSearch(u.city) === normalizeForSearch(meData.city);
      const sameGov = meData.governorate && u.governorate && u.governorate === meData.governorate;
      const sameCountry = meData.country && u.country && u.country === meData.country;
      if(sameCity || sameGov || sameCountry) candidateIds.add(uid);
    });
  }

  const results = [];
  candidateIds.forEach(uid => {
    if(uid === me.uid) return;
    if(myFriendsSet.has(uid)) return;
    if(receivedSet.has(uid) || sentSet.has(uid)) return;
    const u = allUsers[uid];
    if(!u || u.blocked) return;

    const mutualCount = mutualCountMap[uid] || 0;
    let locationLabel = '';
    let locationScore = 0;
    if(meData.city && u.city && normalizeForSearch(u.city) === normalizeForSearch(meData.city)){
      locationLabel = `من ${u.city}`; locationScore = 3;
    }else if(meData.governorate && u.governorate === meData.governorate){
      locationLabel = `من محافظة ${u.governorate}`; locationScore = 2;
    }else if(meData.country && u.country === meData.country){
      locationLabel = `من ${u.country}`; locationScore = 1;
    }

    if(mutualCount === 0 && locationScore === 0) return;
    results.push({ id: uid, data: u, mutualCount, locationScore, locationLabel });
  });

  results.sort((a, b) => b.mutualCount - a.mutualCount || b.locationScore - a.locationScore);
  return results;
}

async function loadPeopleYouMayKnow(){
  try{
    const results = (await computeFriendSuggestions(currentUser, currentUserData || {})).slice(0, 8);
    if(results.length === 0) return;

    const card = document.getElementById('pymkCard');
    const scroll = document.getElementById('pymkScroll');
    scroll.innerHTML = results.map(r => {
      const u = r.data;
      const fullName = [u.firstName, u.lastName].filter(Boolean).join(' ');
      const meta = r.mutualCount > 0 ? `${r.mutualCount} صديق مشترك` : (r.locationLabel || '');
      return `
        <div class="pymk-item" data-uid="${r.id}">
          <a href="profile.html?uid=${r.id}" class="avatar avatar-lg" style="width:64px;height:64px;font-size:22px;" id="pymkAvatar-${r.id}"></a>
          <a href="profile.html?uid=${r.id}" class="pymk-name">${nameWithBadge(fullName, u.verified)}</a>
          <div class="pymk-meta">${escapeHTML(meta)}</div>
          <button class="btn btn-primary pymk-add-btn" data-uid="${r.id}">إضافة صديق</button>
        </div>`;
    }).join('');

    results.forEach(r => avatarHTML(document.getElementById('pymkAvatar-' + r.id), r.data));

    scroll.querySelectorAll('.pymk-add-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'تم الإرسال';
        try{
          await WaselSocial.sendFriendRequest(currentUser, currentUserData, btn.dataset.uid);
          showToast('تم إرسال طلب الصداقة', 'success');
        }catch(err){
          showToast('حصلت مشكلة، جرب تاني', 'error');
          btn.disabled = false;
          btn.textContent = 'إضافة صديق';
        }
      });
    });

    card.style.display = 'block';
  }catch(err){
    console.error('خطأ في تحميل اقتراحات الصداقة:', err);
  }
}

/* ---------------- فتح/قفل نافذة كتابة المنشور ---------------- */
const composerModal = document.getElementById('composerModal');
function openComposer(){ composerModal.classList.add('open'); document.getElementById('postText').focus(); }
function closeComposer(){
  composerModal.classList.remove('open');
  document.getElementById('postText').value = '';
  document.getElementById('imagePreviewWrap').style.display = 'none';
  composerImageBase64 = null;
}
document.getElementById('openComposer').addEventListener('click', openComposer);
document.getElementById('openComposerText').addEventListener('click', openComposer);
document.getElementById('openComposerPhoto').addEventListener('click', () => { openComposer(); document.getElementById('postImageInput').click(); });
document.getElementById('closeComposer').addEventListener('click', closeComposer);
composerModal.addEventListener('click', (e) => { if(e.target === composerModal) closeComposer(); });

/* ---------------- إرفاق صورة بالمنشور ---------------- */
document.getElementById('attachPhotoLabel').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('postImageInput').click();
});
document.getElementById('postImageInput').addEventListener('change', async () => {
  const file = document.getElementById('postImageInput').files[0];
  if(!file) return;
  try{
    let base64 = await compressImage(file, 900, 0.72);
    if(base64SizeBytes(base64) > MAX_POST_IMAGE_BYTES){
      base64 = await compressImage(file, 640, 0.55);
    }
    if(base64SizeBytes(base64) > MAX_POST_IMAGE_BYTES){
      showToast('الصورة كبيرة جدًا حتى بعد الضغط، جرب صورة تانية', 'error');
      return;
    }
    composerImageBase64 = base64;
    document.getElementById('imagePreview').src = base64;
    document.getElementById('imagePreviewWrap').style.display = 'block';
  }catch(err){
    showToast('تعذر تحميل الصورة', 'error');
  }
});
document.getElementById('removeImage').addEventListener('click', () => {
  composerImageBase64 = null;
  document.getElementById('imagePreviewWrap').style.display = 'none';
  document.getElementById('postImageInput').value = '';
});

/* ---------------- نشر المنشور ---------------- */
document.getElementById('publishBtn').addEventListener('click', async () => {
  const text = document.getElementById('postText').value.trim();
  if(!text && !composerImageBase64){
    showToast('اكتب حاجة أو ضيف صورة الأول', 'error');
    return;
  }
  const btn = document.getElementById('publishBtn');
  const btnText = document.getElementById('publishBtnText');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';

  try{
    const fullName = [currentUserData.firstName, currentUserData.lastName].filter(Boolean).join(' ');
    const newPostRef = db.ref('posts').push();
    await newPostRef.set({
      uid: currentUser.uid,
      authorName: fullName,
      authorPhoto: currentUserData.photoBase64 || null,
      authorVerified: !!currentUserData.verified,
      text: text || null,
      imageBase64: composerImageBase64 || null,
      createdAt: Date.now(),
      likesCount: 0,
      commentsCount: 0,
      shares: 0
    });
    closeComposer();
    showToast('تم النشر بنجاح', 'success');
  }catch(err){
    console.error('خطأ في النشر:', err);
    const msg = (err && err.code === 'PERMISSION_DENIED')
      ? 'مفيش صلاحية للنشر — راجع Rules في Firebase'
      : 'حصلت مشكلة أثناء النشر';
    showToast(msg, 'error');
  }finally{
    btn.disabled = false;
    btnText.textContent = 'نشر';
  }
});

/* ---------------- عرض المنشورات لحظيًا ---------------- */
function listenFeed(){
  const feedEl = document.getElementById('feed');
  db.ref('posts').orderByChild('createdAt').on('value', async (snap) => {
    if(!snap.exists()){
      feedEl.innerHTML = '';
      document.getElementById('emptyFeed').style.display = 'block';
      return;
    }
    document.getElementById('emptyFeed').style.display = 'none';

    const posts = [];
    snap.forEach(child => posts.push({ id: child.key, ...child.val() }));
    posts.reverse(); // الأحدث الأول

    // نجيب حالة الحفظ لكل المنشورات الحالية للمستخدم مرة واحدة
    const savesSnap = await db.ref('saves/' + currentUser.uid).get();
    const savedMap = savesSnap.exists() ? savesSnap.val() : {};

    feedEl.innerHTML = posts.map(p => renderPost(p, savedMap)).join('');
    attachPostListeners();
  });
}

function renderPost(p, savedMap){
  const liked = p.likes && p.likes[currentUser.uid];
  const saved = !!savedMap[p.id];
  const avatarStyle = p.authorPhoto
    ? `style="background-image:url(${p.authorPhoto});background-size:cover;background-position:center;"`
    : '';
  const initials = p.authorPhoto ? '' : initialsOf(p.authorName);

  const profileLink = p.uid === currentUser.uid ? 'profile.html' : `profile.html?uid=${p.uid}`;

  return `
  <article class="card post" data-post-id="${p.id}">
    <div class="post-head">
      <a href="${profileLink}" class="avatar avatar-md" ${avatarStyle}>${initials}</a>
      <div class="post-author">
        <a href="${profileLink}" class="post-author-name">${nameWithBadge(p.authorName || 'مستخدم', p.authorVerified)}</a>
        <div class="post-time">${timeAgo(p.createdAt)}</div>
      </div>
      <button class="post-menu-btn">⋯</button>
    </div>

    ${renderPostText(p.text)}
    ${p.imageBase64 ? `<div class="post-image"><img src="${p.imageBase64}" loading="lazy"></div>` : ''}

    <div class="post-stats">
      <span>${p.likesCount ? `${p.likesCount} إعجاب` : ''}</span>
      <span>${p.commentsCount ? `${p.commentsCount} تعليق` : ''} ${p.shares ? `· ${p.shares} مشاركة` : ''}</span>
    </div>

    <div class="post-actions">
      <button class="post-action like-btn ${liked ? 'liked' : ''}" data-id="${p.id}">
        <svg viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}"><path d="M12 20.3c-.28 0-.55-.1-.76-.28C6.98 16.9 3 13.4 3 9.6 3 6.6 5.4 4.2 8.4 4.2c1.7 0 3.3.78 4.35 2.05.02.02.02.02.05 0C13.85 5 15.45 4.2 17.1 4.2c3 0 5.4 2.4 5.4 5.4 0 3.8-3.98 7.3-8.24 10.42-.2.18-.48.28-.76.28Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
        إعجاب
      </button>
      <button class="post-action comment-btn" data-id="${p.id}">
        <svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5C7.03 3.5 3 6.83 3 10.94c0 2.06 1.02 3.92 2.68 5.26-.12.98-.5 2.01-1.18 3.01a.4.4 0 0 0 .43.61c1.6-.34 2.94-.9 3.94-1.6.97.24 2.01.36 3.13.36 4.97 0 9-3.33 9-7.44S16.97 3.5 12 3.5Z"/></g></svg>
        تعليق
      </button>
      <button class="post-action share-btn" data-id="${p.id}">
        <svg viewBox="0 0 24 24" fill="none"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.3 11.9 20.5 3.6a.9.9 0 0 1 1.2 1.2L14 22a.9.9 0 0 1-1.65.08l-3.3-6.6-6.6-3.3a.9.9 0 0 1 .15-1.28.9.9 0 0 1 .3-.24Z"/><path d="M10.7 13.4 15.5 8.6"/></g></svg>
        مشاركة
      </button>
      <button class="post-action save-btn ${saved ? 'saved' : ''}" data-id="${p.id}">
        <svg viewBox="0 0 24 24" fill="${saved ? 'currentColor' : 'none'}"><path d="M7.2 3.7h9.6a1.3 1.3 0 0 1 1.3 1.3v15.4l-6.1-3.9-6.1 3.9V5a1.3 1.3 0 0 1 1.3-1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        حفظ
      </button>
    </div>

    <div class="comments-box" id="comments-${p.id}" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);"></div>
  </article>`;
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------------- نص المنشور: تقصير + عرض المزيد ---------------- */
const POST_TEXT_LIMIT = 260;
function renderPostText(text){
  if(!text) return '';
  const fullSafe = escapeHTML(text);
  if(text.length <= POST_TEXT_LIMIT){
    return `<div class="post-text" data-full="${encodeURIComponent(text)}"><span class="post-text-content">${fullSafe}</span></div>`;
  }
  let cut = text.slice(0, POST_TEXT_LIMIT);
  const lastSpace = cut.lastIndexOf(' ');
  if(lastSpace > POST_TEXT_LIMIT * 0.6) cut = cut.slice(0, lastSpace);
  const shortSafe = escapeHTML(cut) + '…';
  return `<div class="post-text is-truncated" data-full="${encodeURIComponent(text)}" data-short="${encodeURIComponent(shortSafe)}">
    <span class="post-text-content">${shortSafe}</span>
    <button class="post-more-btn" type="button">عرض المزيد</button>
  </div>`;
}

function togglePostText(btn){
  const wrap = btn.closest('.post-text');
  wrap.classList.toggle('is-truncated');
  const truncated = wrap.classList.contains('is-truncated');
  const content = wrap.querySelector('.post-text-content');
  content.innerHTML = truncated ? decodeURIComponent(wrap.dataset.short) : escapeHTML(decodeURIComponent(wrap.dataset.full));
  btn.textContent = truncated ? 'عرض المزيد' : 'عرض أقل';
}

async function copyPostText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast('تم نسخ النص', 'success');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('تم نسخ النص', 'success');
    }catch(e2){
      showToast('تعذر نسخ النص', 'error');
    }
  }
}

/* ---------------- نسخ النص بالضغط المطوّل ---------------- */
function attachLongPressCopy(root){
  (root || document).querySelectorAll('.post-text').forEach(el => {
    if(el.dataset.lpBound) return;
    el.dataset.lpBound = '1';
    let timer = null, longPressed = false;
    const start = () => {
      longPressed = false;
      timer = setTimeout(() => {
        longPressed = true;
        copyPostText(decodeURIComponent(el.dataset.full || ''));
        el.classList.add('copy-flash');
        setTimeout(() => el.classList.remove('copy-flash'), 400);
      }, 550);
    };
    const cancel = () => { clearTimeout(timer); };
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchmove', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('click', (e) => {
      if(longPressed){ e.preventDefault(); e.stopPropagation(); }
    });
  });
}

/* ---------------- ربط أزرار كل منشور ---------------- */
function attachPostListeners(){
  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.add('pop');
      setTimeout(() => btn.classList.remove('pop'), 400);
      toggleLike(btn.dataset.id, btn);
    });
  });
  document.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleSave(btn.dataset.id, btn));
  });
  document.querySelectorAll('.share-btn').forEach(btn => {
    btn.addEventListener('click', () => sharePost(btn.dataset.id, btn));
  });
  document.querySelectorAll('.comment-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleComments(btn.dataset.id));
  });
  document.querySelectorAll('.post-more-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); togglePostText(btn); });
  });
  attachLongPressCopy(document);
}

const likeInFlight = new Set();
async function toggleLike(postId, btn){
  if(likeInFlight.has(postId)) return; // منع الضغط المزدوج/السريع من التسبب في تبديل الحالة مرتين
  likeInFlight.add(postId);
  if(btn) btn.disabled = true;
  try{
    const ref = db.ref(`posts/${postId}/likes/${currentUser.uid}`);
    const countRef = db.ref(`posts/${postId}/likesCount`);
    // قراءة الحالة الحالية ثم الكتابة (transaction على مسار likes مرفوض من قواعد الأمان)
    const snap = await ref.get();
    if(snap.exists()){
      await ref.remove();
      countRef.transaction(v => Math.max(0, (v || 1) - 1));
    }else{
      await ref.set(true);
      countRef.transaction(v => (v || 0) + 1);
      const postSnap = await db.ref(`posts/${postId}`).get();
      const post = postSnap.val();
      if(post && post.uid !== currentUser.uid){
        db.ref(`notifications/${post.uid}`).push({
          type: 'like', fromUid: currentUser.uid,
          fromName: [currentUserData.firstName, currentUserData.lastName].filter(Boolean).join(' '),
          postId, read: false, createdAt: Date.now()
        });
      }
    }
  } finally {
    likeInFlight.delete(postId);
    if(btn) btn.disabled = false;
  }
}

async function toggleSave(postId, btn){
  const ref = db.ref(`saves/${currentUser.uid}/${postId}`);
  const snap = await ref.get();
  if(snap.exists()){
    await ref.remove();
    btn.classList.remove('saved');
    showToast('تم إلغاء الحفظ');
  }else{
    await ref.set(true);
    btn.classList.add('saved');
    showToast('تم الحفظ في المحفوظات', 'success');
  }
}

async function sharePost(postId, btn){
  db.ref(`posts/${postId}/shares`).transaction(v => (v || 0) + 1);
  const url = `${window.location.origin}${window.location.pathname.replace('home.html','')}post.html?id=${postId}`;
  if(navigator.share){
    try{ await navigator.share({ title: 'منشور من واصل', url }); }catch(e){}
  }else{
    navigator.clipboard.writeText(url);
    showToast('تم نسخ رابط المنشور', 'success');
  }
}

/* ---------------- التعليقات ---------------- */
function toggleComments(postId){
  const box = document.getElementById('comments-' + postId);
  const isOpen = box.style.display !== 'none';
  box.style.display = isOpen ? 'none' : 'block';
  if(!isOpen) renderComments(postId, box);
}

function renderComments(postId, box){
  box.innerHTML = `<div class="skeleton" style="height:36px;margin-bottom:8px;"></div>`;
  db.ref('comments/' + postId).orderByChild('createdAt').on('value', (snap) => {
    let list = [];
    snap.forEach(c => list.push({ id: c.key, ...c.val() }));
    const commentsHTML = list.map(c => `
      <div style="display:flex;gap:9px;margin-bottom:10px;">
        <div class="avatar avatar-sm" style="${c.photo ? `background-image:url(${c.photo});background-size:cover;` : ''}">${c.photo ? '' : initialsOf(c.name)}</div>
        <div style="background:var(--bg);border-radius:14px;padding:8px 12px;flex:1;">
          <div style="font-weight:700;font-size:12.5px;">${escapeHTML(c.name || '')}</div>
          <div style="font-size:13.5px;">${escapeHTML(c.text || '')}</div>
        </div>
      </div>`).join('');

    box.innerHTML = `
      ${commentsHTML}
      <div style="display:flex;gap:8px;align-items:center;">
        <input class="field-input" style="padding:9px 14px;" placeholder="اكتب تعليق..." id="input-${postId}">
        <button class="btn btn-primary" style="padding:9px 16px;" id="send-${postId}">إرسال</button>
      </div>`;

    document.getElementById('send-' + postId).addEventListener('click', () => submitComment(postId));
    document.getElementById('input-' + postId).addEventListener('keydown', (e) => {
      if(e.key === 'Enter') submitComment(postId);
    });
  });
}

async function submitComment(postId){
  const input = document.getElementById('input-' + postId);
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const fullName = [currentUserData.firstName, currentUserData.lastName].filter(Boolean).join(' ');
  await db.ref('comments/' + postId).push({
    uid: currentUser.uid, name: fullName, photo: currentUserData.photoBase64 || null,
    text, createdAt: Date.now()
  });
  db.ref(`posts/${postId}/commentsCount`).transaction(v => (v || 0) + 1);
}

/* ---------------- الإشعارات (عداد فقط في الهيدر) ---------------- */
function listenNotifications(){
  db.ref('notifications/' + currentUser.uid).orderByChild('read').equalTo(false).on('value', (snap) => {
    const count = snap.numChildren();
    [document.getElementById('notifBadge'), document.getElementById('notifBadgeDrawer')].forEach(badge => {
      if(!badge) return;
      if(count > 0){
        badge.style.display = 'flex';
        badge.textContent = count > 9 ? '9+' : count;
      }else{
        badge.style.display = 'none';
      }
    });
  });
}
