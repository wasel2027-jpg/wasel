<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واصل — الرئيسية</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ------ صندوق إنشاء منشور ------ */
  .composer{padding:16px;margin-bottom:16px;}
  .composer-top{display:flex;align-items:center;gap:12px;}
  .composer-input{
    flex:1;text-align:right;padding:12px 16px;border-radius:var(--radius-pill);
    background:var(--bg);border:1.5px solid transparent;color:var(--muted);font-size:14px;
    cursor:pointer;transition:border-color .15s;
  }
  .composer-input:hover{border-color:var(--border);}
  .composer-actions{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .composer-action-btn{
    display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink-soft);
    font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;
  }
  .composer-action-btn:hover{background:var(--bg);}

  /* ------ نافذة كتابة المنشور ------ */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(26,27,58,.5);z-index:1000;
    display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;box-shadow:var(--shadow-lg);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border-soft);}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-close{background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;color:var(--ink-soft);font-size:16px;}
  .modal-body{padding:18px 20px;}
  .modal-author{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .modal-author-name{font-weight:800;font-size:14px;}
  #postText{
    width:100%;border:none;outline:none;resize:none;min-height:110px;font-size:16px;
    font-family:inherit;text-align:right;color:var(--ink);
  }
  .modal-image-preview{position:relative;margin-top:10px;border-radius:var(--radius-md);overflow:hidden;display:none;}
  .modal-image-preview img{width:100%;max-height:320px;object-fit:cover;}
  .remove-image{
    position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;
    background:rgba(26,27,58,.65);color:#fff;border:none;font-size:14px;
  }
  .modal-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border-soft);}
  .attach-photo-btn{display:flex;align-items:center;gap:8px;color:var(--success);font-weight:700;font-size:13px;background:var(--success-tint);padding:9px 14px;border-radius:10px;border:none;}
  .img-size-hint{font-size:11px;color:var(--muted);margin-top:6px;}

  /* ------ بطاقة المنشور ------ */
  .post{padding:16px;margin-bottom:16px;}
  .post-head{display:flex;align-items:center;gap:12px;}
  .post-author{flex:1;}
  .post-author-name{font-weight:800;font-size:14.5px;}
  .post-time{font-size:12px;color:var(--muted);}
  .post-menu-btn{background:none;border:none;color:var(--muted);font-size:20px;padding:6px 10px;}
  .post-text{margin:12px 0;font-size:15px;line-height:1.7;white-space:pre-wrap;}
  .post-image{border-radius:var(--radius-md);overflow:hidden;margin-bottom:10px;max-height:460px;}
  .post-image img{width:100%;object-fit:cover;}
  .post-stats{display:flex;justify-content:space-between;padding:8px 2px;font-size:12.5px;color:var(--muted);}
  .post-actions{display:flex;border-top:1px solid var(--border-soft);padding-top:6px;margin-top:4px;}
  .post-action{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    background:none;border:none;padding:10px 4px;border-radius:8px;color:var(--ink-soft);
    font-weight:700;font-size:13px;transition:background .15s,color .15s;
  }
  .post-action:hover{background:var(--bg);}
  .post-action.liked{color:var(--accent);}
  .post-action.saved{color:var(--success);}
  .post-action svg{width:19px;height:19px;}

  .empty-feed{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-feed svg{margin-bottom:14px;opacity:.5;}
</style>
</head>
<body class="auth-pending">
<div class="auth-gate"><div class="spinner dark"></div></div>

<!-- ===================== الهيدر ===================== -->
<header class="app-header">
  <div class="app-header-inner">
    <a href="home.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="19" r="10" fill="#5B4FE8" opacity="0.9"/>
          <circle cx="24" cy="19" r="10" fill="#FF6B5B" opacity="0.85"/>
        </svg>
      </span>
    </a>

    <a href="search.html" class="header-search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>ابحث في واصل...</span>
    </a>

    <div class="header-actions">
      <a href="search.html" class="icon-btn" title="بحث" id="mobileSearchBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
      <a href="messages.html" class="icon-btn" title="الرسائل">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="badge" id="msgBadge" style="display:none;">0</span>
      </a>
      <a href="friend-requests.html" class="icon-btn" title="طلبات الصداقة">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.3" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 19c1.2-3.6 3.7-5.3 6.5-5.3s5.3 1.7 6.5 5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.5 4.5a3.3 3.3 0 0 1 0 6.4M19.5 19c-.7-2.1-1.9-3.6-3.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14 8h5M16.5 5.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="badge" id="friendReqBadge" style="display:none;">0</span>
      </a>
      <a href="notifications.html" class="icon-btn" title="الإشعارات" id="notifBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5v3.2c0 .5-.2 1-.5 1.4L5 15h14l-1.5-2.4a2 2 0 0 1-.5-1.4V8a5 5 0 0 0-5-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="badge" id="notifBadge" style="display:none;">0</span>
      </a>
      <a href="profile.html" class="avatar avatar-sm" id="headerAvatar"></a>
    </div>
  </div>
</header>

<!-- ===================== الصفحة الرئيسية ===================== -->
<main class="page-container">

  <!-- صندوق إنشاء منشور -->
  <div class="card composer">
    <div class="composer-top">
      <div class="avatar avatar-md" id="composerAvatar"></div>
      <div class="composer-input" id="openComposer">بم تفكّر؟</div>
    </div>
    <div class="composer-actions">
      <button class="composer-action-btn" id="openComposerText">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15v5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        كتابة منشور
      </button>
      <button class="composer-action-btn" id="openComposerPhoto">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M21 16l-5.5-5.5L7 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        إضافة صورة
      </button>
    </div>
  </div>

  <!-- اقتراح متابعة حساب واصل الرسمي -->
  <a class="card official-suggest" id="officialSuggest" style="display:none;" href="#">
    <div class="avatar avatar-md" id="officialSuggestAvatar"></div>
    <div class="official-suggest-text">
      <div class="official-suggest-title" id="officialSuggestName"></div>
      <div class="official-suggest-sub">تابع الحساب الرسمي لواصل عشان توصلك آخر التحديثات</div>
    </div>
    <button class="btn btn-primary" id="officialSuggestBtn" style="padding:9px 16px;font-size:13px;">متابعة</button>
  </a>

  <!-- المنشورات -->
  <div id="feed">
    <div class="card post skeleton" style="height:180px;"></div>
    <div class="card post skeleton" style="height:180px;"></div>
  </div>

  <div class="empty-feed" id="emptyFeed" style="display:none;">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <p>لسه مفيش منشورات — كن أول من يشارك!</p>
  </div>
</main>

<!-- ===================== نافذة كتابة المنشور ===================== -->
<div class="modal-overlay" id="composerModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>إنشاء منشور</h3>
      <button class="modal-close" id="closeComposer">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-author">
        <div class="avatar avatar-sm" id="modalAvatar"></div>
        <div class="modal-author-name" id="modalName"></div>
      </div>
      <textarea id="postText" placeholder="بم تفكّر؟" maxlength="2000"></textarea>
      <div class="modal-image-preview" id="imagePreviewWrap">
        <img id="imagePreview">
        <button class="remove-image" id="removeImage">✕</button>
      </div>
    </div>
    <div class="modal-footer">
      <div>
        <label class="attach-photo-btn" id="attachPhotoLabel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M21 16l-5.5-5.5L7 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          إضافة صورة
        </label>
        <input type="file" id="postImageInput" accept="image/*" style="display:none;">
        <div class="img-size-hint">أقصى حجم للصورة محدود عشان قاعدة البيانات لسه صغيرة</div>
      </div>
      <button class="btn btn-primary" id="publishBtn">
        <span id="publishBtnText">نشر</span>
      </button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="js/common.js"></script>
<script src="js/social.js"></script>
<script src="js/app.js"></script>
</body>
</html>
